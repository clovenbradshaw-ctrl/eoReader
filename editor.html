<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minisite Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0b0b0d; --surface: #131316; --surface-2: #1a1a1e;
  --border: #222226; --border-hover: #333338;
  --text: #cdcbc8; --text-dim: #7a7876; --text-faint: #4a4846;
  --accent: #c9a55a; --tag-bg: #ffffff08; --tag-border: #ffffff14; --tag-hover: #ffffff1a;
  --person: #c9a55a; --org: #9a9a9a; --gov: #c06060; --media: #6a9a7a;
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
  --sans: 'DM Sans', -apple-system, system-ui, sans-serif;
}
html, body { height: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 50; }
header h1 { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); }
.spacer { flex: 1; }
.status { font-family: var(--mono); font-size: 11px; color: var(--text-faint); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status.err { color: var(--gov); }
.status.ok { color: var(--media); }
button { font-family: var(--mono); font-size: 11px; cursor: pointer; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 12px; }
button:hover { border-color: var(--border-hover); }
button.primary { border-color: #c9a55a40; color: var(--accent); background: #c9a55a10; }
button.primary:hover { background: #c9a55a1c; }

.layout { display: flex; height: calc(100vh - 49px); }
.editor-col { flex: 1; overflow-y: auto; padding: 32px 40px 140px; }
.editor-inner { max-width: 720px; margin: 0 auto; }
.sidebar { width: 360px; border-left: 1px solid var(--border); overflow-y: auto; background: var(--surface); }

.field { margin-bottom: 12px; }
.field label { display: block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); margin-bottom: 4px; }
.field input, .field textarea, .field select {
  width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
  font-family: var(--sans); font-size: 14px; padding: 7px 10px; border-radius: 4px;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

.toolbar { display: flex; gap: 6px; margin: 20px 0 10px; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 5; }

#body-editor { min-height: 360px; outline: none; }
#body-editor:focus { outline: none; }
#body-editor .article-p { font-size: 16.5px; line-height: 1.78; margin-bottom: 16px; }
#body-editor .article-quote { border-left: 3px solid var(--accent); padding: 8px 0 8px 18px; font-size: 18px; font-style: italic; color: #e8e6e3; margin: 22px 0; }
#body-editor .section-label { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 32px 0 16px; }
#body-editor div { font-size: 16.5px; line-height: 1.78; margin-bottom: 16px; }
.entity-tag { font-family: var(--mono); font-size: 0.82em; font-weight: 500; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--tag-border); background: var(--tag-bg); white-space: nowrap; }
.entity-tag[data-type="person"] { color: var(--person); }
.entity-tag[data-type="org"] { color: var(--org); }
.entity-tag[data-type="gov"] { color: var(--gov); }
.entity-tag[data-type="media"] { color: var(--media); }

.side-tabs { display: flex; border-bottom: 1px solid var(--border); }
.side-tab { flex: 1; padding: 10px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--text-faint); }
.side-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.side-panel { display: none; padding: 16px; }
.side-panel.active { display: block; }

.list-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.list-card .lc-name { font-weight: 600; font-size: 13px; color: #e8e6e3; }
.list-card .lc-meta { font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-top: 2px; }
.lc-row { display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.mini-btn { font-size: 10px; padding: 3px 7px; }

.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; }
.modal-backdrop.open { display: flex; align-items: center; justify-content: center; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: min(460px, 92vw); max-height: 80vh; overflow-y: auto; padding: 20px; }
.modal h3 { font-family: var(--mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
.pick-item { padding: 8px 10px; border: 1px solid var(--border); border-radius: 5px; margin-bottom: 6px; cursor: pointer; }
.pick-item:hover { border-color: var(--accent); }
.hint { font-size: 12px; color: var(--text-faint); margin: 8px 0; }
a.link { color: var(--accent); }
::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <a href="index.html" title="Back to the reader app"
     style="font-family:var(--mono);font-size:13px;color:var(--text-dim);text-decoration:none;">← {plain text}</a>
  <h1>Minisite Editor</h1>
  <button onclick="setBlockType('p')">¶ Paragraph</button>
  <button onclick="setBlockType('quote')">" Quote</button>
  <button onclick="setBlockType('section')">§ Section</button>
  <button onclick="tagEntity()">+ Tag Entity</button>
  <div class="spacer"></div>
  <button onclick="processBody()" title="Walk this draft through the reader's coreference pipeline">process body</button>
  <button onclick="viewMinisite()">view minisite</button>
  <div class="status" id="status">ready</div>
  <button onclick="doPublish('draft')">Save Draft</button>
  <button class="primary" onclick="doPublish('published')">Publish</button>
</header>

<div class="layout">
  <div class="editor-col">
    <div class="editor-inner">
      <div class="field-row">
        <div class="field"><label>Site (namespace)</label><input id="f-site" value="rich-text"></div>
        <div class="field"><label>Article slug</label><input id="f-slug" placeholder="my-article-slug"></div>
      </div>
      <div class="field"><label>Title</label><input id="f-title" placeholder="Article title"></div>
      <div class="field"><label>Subtitle</label><input id="f-subtitle" placeholder="Optional subtitle"></div>
      <div class="field-row">
        <div class="field"><label>Publication</label><input id="f-publication" value="{Rich Text}"></div>
        <div class="field"><label>Date</label><input id="f-date" placeholder="May 15, 2026"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Author</label><input id="f-author" value="anon"></div>
        <div class="field"><label>Canonical URL (Substack)</label><input id="f-url" placeholder="https://…"></div>
      </div>
      <div class="toolbar" style="margin-top:8px"><span class="hint">Body — select text then "+ Tag Entity" to mark an entity.</span></div>
      <div id="body-editor" contenteditable="true"><p class="article-p"><br></p></div>
    </div>
  </div>

  <div class="sidebar">
    <div class="side-tabs">
      <button class="side-tab active" data-tab="entities" onclick="sideTab('entities')">Entities</button>
      <button class="side-tab" data-tab="connections" onclick="sideTab('connections')">Connections</button>
    </div>
    <div class="side-panel active" id="panel-entities">
      <button class="mini-btn" onclick="openEntityForm()">+ New entity</button>
      <div class="hint" id="ent-count"></div>
      <div id="entity-list"></div>
    </div>
    <div class="side-panel" id="panel-connections">
      <button class="mini-btn" onclick="openConnForm()">+ New connection</button>
      <div class="hint" id="conn-count"></div>
      <div id="conn-list"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="js/publish/eo-publish.js"></script>
<script src="js/publish/relations.js"></script>
<script src="js/publish/opfs-store.js"></script>
<script src="js/publish/fold.js"></script>
<script src="js/publish/api.js"></script>
<script>
'use strict';
var TYPE_COLORS = { person: '#c9a55a', org: '#9a9a9a', gov: '#c06060', media: '#6a9a7a' };
var TYPE_LABELS = { person: 'Person', org: 'Organization', gov: 'Government', media: 'Media' };

var workingEntities = {};      // id -> { id, name, type, description, articles:[] }
var workingConnections = [];   // { from, to, rel, evidence, article }
var loadedEntityHash = {};     // id -> hash at load time
var loadedConnHash = {};       // connSlug -> hash at load time
var pendingRange = null;
var walkEntities = {};         // id -> editor-shaped entity bridged from the reader app's walk graph

function $(id) { return document.getElementById(id); }
function val(id) { return $(id).value.trim(); }
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function param(k) { return new URLSearchParams(location.search).get(k); }
function status(msg, kind) {
  var el = $('status');
  el.textContent = msg;
  el.className = 'status' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '');
}
function colorFor(t) { return TYPE_COLORS[t] || TYPE_COLORS.org; }

// ── block editing ──────────────────────────────────────────────────────
function currentBlock() {
  var sel = window.getSelection();
  if (!sel.rangeCount) return null;
  var node = sel.getRangeAt(0).startContainer;
  var ed = $('body-editor');
  if (!ed.contains(node)) return null;
  while (node && node.parentNode !== ed) node = node.parentNode;
  return (node && node.parentNode === ed) ? node : null;
}
function setBlockType(type) {
  var block = currentBlock();
  if (!block) { status('Place the cursor in a block first', 'err'); return; }
  var tag = type === 'quote' ? 'blockquote' : type === 'section' ? 'h2' : 'p';
  var cls = type === 'quote' ? 'article-quote' : type === 'section' ? 'section-label' : 'article-p';
  var el = document.createElement(tag);
  el.className = cls;
  while (block.firstChild) el.appendChild(block.firstChild);
  if (!el.firstChild) el.appendChild(document.createElement('br'));
  block.parentNode.replaceChild(el, block);
  var range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// ── entity tagging ─────────────────────────────────────────────────────
function tagEntity() {
  var sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { status('Select some text to tag', 'err'); return; }
  var range = sel.getRangeAt(0);
  if (!$('body-editor').contains(range.commonAncestorContainer)) {
    status('Select text inside the article body', 'err'); return;
  }
  pendingRange = range.cloneRange();
  openEntityPicker(range.toString().trim());
}
function applyTag(id) {
  var e = workingEntities[id];
  if (!e || !pendingRange) return;
  var span = document.createElement('span');
  span.className = 'entity-tag';
  span.setAttribute('contenteditable', 'false');
  span.dataset.entity = id;
  span.dataset.type = e.type;
  span.textContent = e.name;
  try {
    pendingRange.deleteContents();
    pendingRange.insertNode(span);
    status('Tagged "' + e.name + '"', 'ok');
  } catch (err) {
    status('Could not tag — keep the selection within one paragraph', 'err');
  }
  pendingRange = null;
}

// ── serialization ──────────────────────────────────────────────────────
function serializeInline(node, refs) {
  var out = '';
  for (var i = 0; i < node.childNodes.length; i++) {
    var n = node.childNodes[i];
    if (n.nodeType === 3) { out += n.textContent; }
    else if (n.nodeType === 1) {
      if (n.classList && n.classList.contains('entity-tag')) {
        var id = n.dataset.entity;
        refs[id] = true;
        out += '{{' + id + '}}';
      } else if (n.tagName === 'BR') {
        out += ' ';
      } else {
        out += serializeInline(n, refs);
      }
    }
  }
  return out;
}
function serializeBody() {
  var ed = $('body-editor'), sections = [], refs = {};
  for (var i = 0; i < ed.children.length; i++) {
    var block = ed.children[i];
    if (block.classList.contains('section-label')) {
      var label = block.textContent.trim();
      if (label) sections.push({ type: 'section', label: label });
      continue;
    }
    var isQuote = block.classList.contains('article-quote');
    var text = serializeInline(block, refs).replace(/\s+/g, ' ').trim();
    if (text) sections.push({ type: isQuote ? 'quote' : 'p', text: text });
  }
  return { sections: sections, entityRefs: Object.keys(refs) };
}
function inlineToHtml(text) {
  return esc(text).replace(/\{\{([^}]+)\}\}/g, function (m, id) {
    var e = workingEntities[id];
    var type = e ? e.type : 'org';
    var name = e ? e.name : id;
    return '<span class="entity-tag" contenteditable="false" data-entity="' + esc(id) +
      '" data-type="' + esc(type) + '">' + esc(name) + '</span>';
  });
}
function loadArticleIntoEditor(art) {
  $('f-title').value = art.title || '';
  var m = art.meta || {};
  $('f-subtitle').value = m.subtitle || '';
  $('f-publication').value = m.publication || '';
  $('f-date').value = m.date || '';
  $('f-url').value = m.url || '';
  var html = (art.sections || []).map(function (s) {
    if (s.type === 'section') return '<h2 class="section-label">' + esc(s.label) + '</h2>';
    if (s.type === 'quote') return '<blockquote class="article-quote">' + inlineToHtml(s.text) + '</blockquote>';
    return '<p class="article-p">' + inlineToHtml(s.text) + '</p>';
  }).join('');
  $('body-editor').innerHTML = html || '<p class="article-p"><br></p>';
}

// ── sidebar: entities ──────────────────────────────────────────────────
function sideTab(tab) {
  Array.prototype.forEach.call(document.querySelectorAll('.side-tab'), function (t) {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  $('panel-entities').classList.toggle('active', tab === 'entities');
  $('panel-connections').classList.toggle('active', tab === 'connections');
}
function renderEntityList() {
  var ids = Object.keys(workingEntities);
  $('ent-count').textContent = ids.length + ' entities (shared across all articles)';
  $('entity-list').innerHTML = ids.sort().map(function (id) {
    var e = workingEntities[id];
    return '<div class="list-card">' +
      '<div class="lc-row"><span class="dot" style="background:' + colorFor(e.type) + '"></span>' +
      '<span class="lc-name">' + esc(e.name) + '</span></div>' +
      '<div class="lc-meta">' + esc(id) + ' · ' + (TYPE_LABELS[e.type] || e.type) + '</div>' +
      '<div style="margin-top:6px"><button class="mini-btn" onclick="openEntityForm(\'' + esc(id) +
      '\')">edit</button></div></div>';
  }).join('');
}
function openEntityForm(id) {
  var e = id ? workingEntities[id] : null;
  var typeOpts = Object.keys(TYPE_LABELS).map(function (k) {
    return '<option value="' + k + '"' + (e && e.type === k ? ' selected' : '') + '>' + TYPE_LABELS[k] + '</option>';
  }).join('');
  $('modal').innerHTML = '<h3>' + (e ? 'Edit entity' : 'New entity') + '</h3>' +
    '<div class="field"><label>Entity id (slug)</label><input id="m-id" value="' + esc(id || '') +
    '"' + (e ? ' disabled' : '') + ' placeholder="tom-turner"></div>' +
    '<div class="field"><label>Name</label><input id="m-name" value="' + esc(e ? e.name : '') + '"></div>' +
    '<div class="field"><label>Type</label><select id="m-type">' + typeOpts + '</select></div>' +
    '<div class="field"><label>Description</label><textarea id="m-desc" rows="4">' +
    esc(e ? e.description : '') + '</textarea></div>' +
    '<button class="primary" onclick="saveEntity(' + (e ? "'" + id + "'" : 'null') + ')">Save</button> ' +
    '<button onclick="closeModal()">Cancel</button>';
  openModal();
}
function saveEntity(existingId) {
  var id = existingId || EO.slugify(val('m-id') || $('m-name').value);
  if (!id) { status('Entity needs an id', 'err'); return; }
  workingEntities[id] = {
    id: id,
    name: $('m-name').value.trim() || id,
    type: $('m-type').value,
    description: $('m-desc').value.trim(),
    articles: workingEntities[id] ? (workingEntities[id].articles || []) : [],
  };
  closeModal();
  renderEntityList();
  status('Entity "' + workingEntities[id].name + '" saved (publish to push)', 'ok');
}

// ── entity picker (for tagging) ────────────────────────────────────────
function openEntityPicker(selectedText) {
  var ids = Object.keys(workingEntities).sort();
  var list = ids.map(function (id) {
    var e = workingEntities[id];
    return '<div class="pick-item" onclick="pickEntity(\'' + esc(id) + '\')">' +
      '<span class="dot" style="display:inline-block;background:' + colorFor(e.type) + '"></span> ' +
      esc(e.name) + ' <span style="color:var(--text-faint)">· ' + esc(id) + '</span></div>';
  }).join('');
  var walkIds = Object.keys(walkEntities).filter(function (id) { return !workingEntities[id]; }).sort();
  var walkList = walkIds.map(function (id) {
    var e = walkEntities[id];
    return '<div class="pick-item" onclick="pickWalkEntity(\'' + esc(id) + '\')">' +
      '<span class="dot" style="display:inline-block;background:' + colorFor(e.type) + '"></span> ' +
      esc(e.name) + ' <span style="color:var(--text-faint)">· ' + esc(id) + '</span></div>';
  }).join('');
  $('modal').innerHTML = '<h3>Tag entity</h3>' +
    '<div class="hint">Selected: "' + esc(selectedText) + '"</div>' +
    '<input id="pick-search" placeholder="filter entities…" style="width:100%;margin-bottom:10px;' +
    'background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:4px">' +
    '<div id="pick-list">' + (list || '<div class="hint">No published entities yet.</div>') + '</div>' +
    (walkList ? '<div class="hint" style="margin-top:14px;border-top:1px solid var(--border);' +
      'padding-top:10px">from your reading · not yet published</div>' +
      '<div id="pick-walk-list">' + walkList + '</div>' : '') +
    '<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">' +
    '<button onclick="newEntityFromPicker()">+ Create new entity</button></div>';
  openModal();
  var search = $('pick-search');
  search.oninput = function () {
    var q = search.value.toLowerCase();
    ['pick-list', 'pick-walk-list'].forEach(function (lid) {
      var el = $(lid);
      if (!el) return;
      Array.prototype.forEach.call(el.children, function (c) {
        c.style.display = c.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
      });
    });
  };
  search.focus();
}
function pickEntity(id) { closeModal(); applyTag(id); }
function pickWalkEntity(id) {
  var w = walkEntities[id];
  if (w && !workingEntities[id]) {
    workingEntities[id] = { id: id, name: w.name, type: w.type, description: w.description, articles: [] };
    renderEntityList();
  }
  closeModal();
  applyTag(id);
}
function newEntityFromPicker() {
  var typeOpts = Object.keys(TYPE_LABELS).map(function (k) {
    return '<option value="' + k + '">' + TYPE_LABELS[k] + '</option>';
  }).join('');
  $('modal').innerHTML = '<h3>New entity</h3>' +
    '<div class="field"><label>Entity id (slug)</label><input id="m-id" placeholder="tom-turner"></div>' +
    '<div class="field"><label>Name</label><input id="m-name"></div>' +
    '<div class="field"><label>Type</label><select id="m-type">' + typeOpts + '</select></div>' +
    '<div class="field"><label>Description</label><textarea id="m-desc" rows="3"></textarea></div>' +
    '<button class="primary" onclick="createAndTag()">Create &amp; tag</button> ' +
    '<button onclick="closeModal()">Cancel</button>';
}
function createAndTag() {
  var id = EO.slugify(val('m-id') || $('m-name').value);
  if (!id) { status('Entity needs an id', 'err'); return; }
  workingEntities[id] = {
    id: id, name: $('m-name').value.trim() || id,
    type: $('m-type').value, description: $('m-desc').value.trim(), articles: [],
  };
  renderEntityList();
  closeModal();
  applyTag(id);
}

// ── sidebar: connections ───────────────────────────────────────────────
function renderConnList() {
  $('conn-count').textContent = workingConnections.length + ' connections (shared)';
  $('conn-list').innerHTML = workingConnections.map(function (c, i) {
    var f = workingEntities[c.from], t = workingEntities[c.to];
    return '<div class="list-card">' +
      '<div class="lc-name">' + esc(f ? f.name : c.from) + ' → ' + esc(t ? t.name : c.to) + '</div>' +
      '<div class="lc-meta">' + esc(c.rel) + '</div>' +
      '<div style="margin-top:6px"><button class="mini-btn" onclick="openConnForm(' + i + ')">edit</button> ' +
      '<button class="mini-btn" onclick="deleteConn(' + i + ')">remove</button></div></div>';
  }).join('');
}
function entitySelectOptions(sel) {
  return Object.keys(workingEntities).sort().map(function (id) {
    return '<option value="' + esc(id) + '"' + (sel === id ? ' selected' : '') + '>' +
      esc(workingEntities[id].name) + '</option>';
  }).join('');
}
function relationVocab() {
  return (typeof Relations !== 'undefined') ? Relations.buildVocab(workingConnections) : [];
}
function openConnForm(idx) {
  var c = (idx != null) ? workingConnections[idx] : null;
  var vocab = relationVocab();
  var opts = vocab.map(function (r) { return '<option value="' + esc(r) + '">'; }).join('');
  $('modal').innerHTML = '<h3>' + (c ? 'Edit connection' : 'New connection') + '</h3>' +
    '<div class="field"><label>From</label><select id="c-from">' + entitySelectOptions(c && c.from) + '</select></div>' +
    '<div class="field"><label>To</label><select id="c-to">' + entitySelectOptions(c && c.to) + '</select></div>' +
    '<div class="field"><label>Relation</label><input id="c-rel" list="c-rel-vocab" value="' +
    esc(c ? c.rel : '') + '" placeholder="funds, cites, employs…">' +
    '<datalist id="c-rel-vocab">' + opts + '</datalist></div>' +
    '<div class="field"><label>Definition <span style="text-transform:none;color:var(--text-faint)">' +
    '— one line, required for a new relation word</span></label>' +
    '<input id="c-reldef" value="' + esc(c && c.relDef ? c.relDef : '') + '" placeholder="what this relation means"></div>' +
    '<div class="field"><label>Evidence</label><textarea id="c-ev" rows="3">' +
    esc(c ? c.evidence : '') + '</textarea></div>' +
    '<button class="primary" onclick="saveConn(' + (c ? idx : 'null') + ')">Save</button> ' +
    '<button onclick="closeModal()">Cancel</button>';
  openModal();
}
function saveConn(idx) {
  var from = $('c-from').value, to = $('c-to').value, rel = val('c-rel');
  if (!from || !to || !rel) { status('Connection needs from, to, relation', 'err'); return; }
  var relDef = val('c-reldef');
  var vocab = relationVocab();
  if (typeof Relations !== 'undefined' && !Relations.isKnown(rel, vocab) && !relDef) {
    status('"' + rel + '" is a new relation — add a one-line definition', 'err'); return;
  }
  var conn = { from: from, to: to, rel: rel, relDef: relDef, evidence: $('c-ev').value.trim(), article: null };
  if (idx != null) { conn.article = workingConnections[idx].article; workingConnections[idx] = conn; }
  else workingConnections.push(conn);
  closeModal();
  renderConnList();
  status('Connection saved (publish to push)', 'ok');
}
function deleteConn(idx) { workingConnections.splice(idx, 1); renderConnList(); }

function openModal() { $('modal-backdrop').classList.add('open'); }
function closeModal() { $('modal-backdrop').classList.remove('open'); }

// ── load existing data ─────────────────────────────────────────────────
async function loadSites() {
  var text = await PublishAPI.readRaw(EO.LOG_FILE).catch(function () { return null; });
  if (text == null) {
    var cached = await opfsStore.readText('cache/eo-log.jsonl');
    text = cached || '';
  } else {
    opfsStore.writeText('cache/eo-log.jsonl', text);
  }
  var folded = Fold.foldSites(text);
  workingEntities = {};
  Object.keys(folded.entities).forEach(function (id) {
    var e = folded.entities[id];
    workingEntities[id] = { id: id, name: e.name, type: e.type, description: e.description, articles: e.articles || [] };
  });
  workingConnections = folded.connections.map(function (c) {
    return {
      from: c.from, to: c.to, rel: c.rel, evidence: c.evidence, article: c.article,
      relDef: (c.meta && c.meta.relDef) || c.relDef || '',
    };
  });
  snapshotHashes();
  renderEntityList();
  renderConnList();
}
function snapshotHashes() {
  var site = val('f-site') || 'rich-text';
  loadedEntityHash = {};
  Object.keys(workingEntities).forEach(function (id) {
    var e = workingEntities[id];
    loadedEntityHash[id] = EO.entityEntry({
      site: site, slug: id, name: e.name, entityType: e.type,
      description: e.description, articles: e.articles,
    }).hash;
  });
  loadedConnHash = {};
  workingConnections.forEach(function (c) {
    var entry = EO.connectionEntry({
      site: site, from: c.from, to: c.to, rel: c.rel, evidence: c.evidence,
      article: c.article, relDef: c.relDef,
    });
    loadedConnHash[entry.slug] = entry.hash;
  });
}
async function loadArticle(slug) {
  var text = await PublishAPI.readRaw(EO.LOG_FILE).catch(function () { return null; });
  if (text == null) return;
  var art = Fold.foldArticle(text, slug);
  if (art) { loadArticleIntoEditor(art); status('Loaded article "' + slug + '" for editing'); }
}

// ── walk-graph bridge ──────────────────────────────────────────────────
// The reader app (index.html) walks documents into a 9-terrain entity graph
// stored in localStorage. Same origin lets us read it directly, so entities
// discovered while reading become taggable here without re-typing.
function walkEntityToWorking(id, w) {
  w = w || {};
  var hay = ((w.subtype || '') + ' ' + (w.kind || '')).toLowerCase();
  var type = 'org';
  if (/person|official|journalist|reporter|speaker/.test(hay)) type = 'person';
  else if (/gov|agenc|department|commission|senat|congress|council|ministr|bureau|court/.test(hay)) type = 'gov';
  else if (/media|news|paper|press|broadcast|outlet/.test(hay)) type = 'media';
  return {
    id: id,
    name: w.displayName || w.canonical || id,
    type: type,
    description: w.hypothesis || '',
    articles: [],
  };
}
function loadWalkGraph() {
  walkEntities = {};
  var raw;
  try { raw = localStorage.getItem('plaintext_graph'); } catch (e) { return; }
  if (!raw) return;
  var g;
  try { g = JSON.parse(raw); } catch (e) { return; }
  var ents = (g && g.entities) || {};
  Object.keys(ents).forEach(function (id) {
    walkEntities[id] = walkEntityToWorking(id, ents[id]);
  });
}
// ── process body in the reader ─────────────────────────────────────────
// Hand the draft body to the reader app (index.html) so it runs the same
// clause-by-clause walk as ingested input data — coreference resolution
// against the live graph, revising entity definitions in place. The handoff
// rides through localStorage (same origin); the reader consumes it on boot.
function processBody() {
  var ser = serializeBody();
  var text = ser.sections.map(function (s) {
    if (s.type === 'section') return s.label;
    return (s.text || '').replace(/\{\{([^}]+)\}\}/g, function (m, id) {
      var e = workingEntities[id] || walkEntities[id];
      return e ? e.name : id;
    });
  }).filter(Boolean).join('\n\n');
  if (text.trim().length < 50) {
    status('Body is too short to process (need at least 50 characters)', 'err');
    return;
  }
  if (!confirm('Process this draft in the reader? Unpublished editor changes are not saved — publish or save a draft first if you want to keep them.')) {
    return;
  }
  var title = val('f-title') || val('f-slug') || 'Editor draft';
  try {
    localStorage.setItem('plaintext_pending_ingest', JSON.stringify({
      title: title, body: text, ts: Date.now(),
    }));
  } catch (e) {
    status('Could not hand off to the reader: ' + e.message, 'err');
    return;
  }
  location.href = 'index.html';
}

function viewMinisite() {
  var slug = EO.slugify(val('f-slug'));
  location.href = slug ? 'minisite.html?slug=' + encodeURIComponent(slug) : 'minisite.html';
}

// ── publish ────────────────────────────────────────────────────────────
// doPublish() builds an append plan and shows a preview; the user confirms
// before any line is written. INS/CON lines publish before the article DEF
// so the article's entityRefs always resolve on the minisite.
function doPublish(stance) { openPublishPreview(stance); }

function buildPublishPlan(stance) {
  var site = val('f-site'), slug = EO.slugify(val('f-slug'));
  var title = val('f-title');
  if (!site) { status('Need a site namespace', 'err'); return null; }
  if (!slug) { status('Need an article slug', 'err'); return null; }
  if (!title) { status('Need a title', 'err'); return null; }
  $('f-slug').value = slug;

  var ser = serializeBody();
  var meta = {
    subtitle: val('f-subtitle'), publication: val('f-publication'),
    date: val('f-date'), url: val('f-url'),
  };
  var author = val('f-author') || 'anon';

  // record this article on every referenced entity
  ser.entityRefs.forEach(function (id) {
    var e = workingEntities[id];
    if (!e) return;
    e.articles = e.articles || [];
    var found = null;
    for (var i = 0; i < e.articles.length; i++) if (e.articles[i].slug === slug) found = e.articles[i];
    if (found) { found.title = title; found.date = meta.date; }
    else e.articles.push({ slug: slug, title: title, date: meta.date });
  });

  var entityEntries = [];
  Object.keys(workingEntities).forEach(function (id) {
    var e = workingEntities[id];
    var entry = EO.entityEntry({
      site: site, slug: id, name: e.name, entityType: e.type,
      description: e.description, articles: e.articles, author: author,
    });
    if (loadedEntityHash[id] !== entry.hash) entityEntries.push(entry);
  });

  var connEntries = [];
  workingConnections.forEach(function (c) {
    var ce = EO.connectionEntry({
      site: site, from: c.from, to: c.to, rel: c.rel, evidence: c.evidence,
      article: c.article || slug, author: author, relDef: c.relDef,
    });
    if (loadedConnHash[ce.slug] !== ce.hash) connEntries.push(ce);
  });

  var artEntry = EO.articleEntry({
    site: site, slug: slug, title: title, meta: meta,
    sections: ser.sections, entityRefs: ser.entityRefs, author: author, stance: stance,
  });

  return {
    site: site, slug: slug, stance: stance, refCount: ser.entityRefs.length,
    entityEntries: entityEntries, connEntries: connEntries, articleEntry: artEntry,
  };
}

function openPublishPreview(stance) {
  var plan = buildPublishPlan(stance);
  if (!plan) return;
  var rows = [];
  plan.entityEntries.forEach(function (e) {
    rows.push('<div><b style="color:var(--media)">INS</b> ' + esc(EO.LOG_FILE) + ' · ' +
      esc(e.slug) + ' · ' + esc(e.payload.entityType) + '</div>');
  });
  plan.connEntries.forEach(function (c) {
    rows.push('<div><b style="color:var(--accent)">CON</b> ' + esc(EO.LOG_FILE) + ' · ' +
      esc(c.payload.from) + ' → ' + esc(c.payload.to) + ' · ' + esc(c.payload.rel) + '</div>');
  });
  rows.push('<div><b style="color:var(--person)">DEF</b> ' + esc(EO.LOG_FILE) +
    ' · ' + esc(plan.slug) + ' · ' + plan.refCount + ' refs · ' + esc(plan.stance) + '</div>');
  $('modal').innerHTML = '<h3>About to append</h3>' +
    '<div class="hint">' + plan.entityEntries.length + ' entit' +
    (plan.entityEntries.length === 1 ? 'y' : 'ies') + ', ' + plan.connEntries.length +
    ' connection' + (plan.connEntries.length === 1 ? '' : 's') +
    ', 1 article — appended to the {plain text} log on GitHub.</div>' +
    '<div style="font-family:var(--mono);font-size:11px;line-height:1.95;margin:10px 0;' +
    'border:1px solid var(--border);border-radius:5px;padding:8px 10px;background:var(--surface-2)">' +
    rows.join('') + '</div>' +
    '<button class="primary" id="prev-go">append &amp; publish</button> ' +
    '<button onclick="closeModal()">Cancel</button>';
  openModal();
  $('prev-go').onclick = function () { executePublishPlan(plan); };
}

async function executePublishPlan(plan) {
  closeModal();
  // One webhook call appends every record (INS/CON before the article DEF) in
  // a single server-side commit — no per-record GET/PUT race on the log file.
  var records = plan.entityEntries.concat(plan.connEntries, [plan.articleEntry]);
  try {
    status('Publishing ' + records.length + ' record' +
      (records.length === 1 ? '' : 's') + '…');
    await PublishAPI.publish(EO.LOG_FILE, records);
    plan.entityEntries.forEach(function (e) { loadedEntityHash[e.slug] = e.hash; });
    plan.connEntries.forEach(function (c) { loadedConnHash[c.slug] = c.hash; });

    renderEntityList();
    renderConnList();
    status('Published — ' + plan.entityEntries.length + ' entities, ' +
      plan.connEntries.length + ' connections, article (' + plan.stance + ')', 'ok');
    showResult('minisite.html?slug=' + encodeURIComponent(plan.slug), plan.slug);
  } catch (err) {
    status('Publish failed: ' + err.message, 'err');
  }
}
function showResult(url, slug) {
  $('modal').innerHTML = '<h3>Published</h3>' +
    '<div class="hint">Article minisite (paste this link into Substack):</div>' +
    '<div style="margin:8px 0"><a class="link" href="' + esc(url) + '" target="_blank">' + esc(url) + '</a></div>' +
    '<div class="hint">Entity profile pages use <code>minisite.html?entity=&lt;id&gt;</code>.</div>' +
    '<button class="primary" onclick="closeModal()">Done</button>';
  openModal();
}

// ── boot ───────────────────────────────────────────────────────────────
async function boot() {
  status('Loading entities…');
  await loadSites();
  loadWalkGraph();
  var slug = param('slug');
  if (slug) { $('f-slug').value = slug; await loadArticle(slug); }
  else {
    var wn = Object.keys(walkEntities).filter(function (id) { return !workingEntities[id]; }).length;
    status('Ready — ' + Object.keys(workingEntities).length + ' entities loaded' +
      (wn ? ' · ' + wn + ' from your reading' : ''));
  }
}
boot();
</script>
</body>
