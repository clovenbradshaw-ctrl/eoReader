<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{plain text}</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root {
    --accent: #88C070;
    --bg: #1a1a1a;
    --surface: #242424;
    --border: #333;
    --text: #ccc;
    --text-bright: #eee;
    --text-dim: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 15px;
    color: var(--accent);
    font-weight: 400;
    white-space: nowrap;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex: 1;
    align-items: center;
  }
  input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-bright);
    padding: 6px 10px;
    font-family: inherit;
    font-size: 13px;
    border-radius: 3px;
    width: 260px;
  }
  input[type="text"]:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .prompt-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
    color: var(--accent); border-color: var(--accent);
  }
  .prompt-toggle:hover { color: var(--text); border-color: #555; }
  .matrix-indicator {
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .matrix-indicator.connected { color: var(--accent); }
  .matrix-indicator.disconnected { color: var(--text-dim); }
  .status {
    margin-left: auto;
    color: var(--text-dim);
    font-size: 11px;
    white-space: nowrap;
  }

  /* prompt editor */
  #prompt-editor {
    display: none;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #prompt-editor.open { display: block; }
  #prompt-editor label {
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 8px;
  }
  #prompt-editor textarea {
    width: 100%;
    min-height: 180px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: inherit;
    font-size: 12px;
    line-height: 1.6;
    padding: 12px;
    border-radius: 3px;
    resize: vertical;
  }
  #prompt-editor textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .prompt-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    align-items: center;
  }
  .prompt-actions button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 12px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
  }
  .prompt-actions button:hover { color: var(--accent); border-color: var(--accent); }
  .prompt-saved {
    color: var(--accent);
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .prompt-saved.show { opacity: 1; }

  /* feed items */
  .item {
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
  }
  .item-source {
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .item-date {
    color: var(--text-dim);
    font-size: 11px;
    margin-left: 8px;
    text-transform: none;
    letter-spacing: 0;
  }
  .item-title {
    font-size: 14px;
    color: var(--text-bright);
    font-weight: 600;
    margin-bottom: 6px;
    font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;
  }
  .item-title a { color: inherit; text-decoration: none; }
  .item-title a:hover { text-decoration: underline; }
  .item-snippet {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.6;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s;
  }
  .item.expanded .item-snippet { max-height: 800px; overflow-y: auto; }
  .item-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .act-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 2px 8px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    border-radius: 2px;
  }
  .act-btn:hover { color: var(--accent); border-color: var(--accent); }
  .act-btn.copied { color: var(--accent); border-color: var(--accent); }
  .act-btn.generating { color: #d4a84d; border-color: #d4a84d; cursor: wait; }
  .act-btn.errored { color: #c06060; border-color: #c06060; }
  .expand-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    padding: 2px 0;
  }
  .expand-btn:hover { color: var(--text); }

  /* claude output */
  .claude-output {
    margin-top: 10px;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    display: none;
  }
  .claude-output.visible { display: block; }
  .claude-output .rendered-entry {
    color: var(--text-bright);
    font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;
    font-size: 13px;
    line-height: 1.6;
  }
  .claude-output .rendered-entry p {
    margin-bottom: 8px;
  }
  .claude-output .rendered-entry p:last-child {
    margin-bottom: 0;
  }
  .claude-output .rendered-entry a {
    color: var(--accent);
    text-decoration: none;
  }
  .claude-output .rendered-entry a:hover {
    text-decoration: underline;
  }
  .claude-output .output-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .claude-output .output-label {
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  /* eo extraction display */
  .eo-output {
    margin-top: 8px;
    padding: 10px;
    background: #1e2a1e;
    border: 1px solid #2a3d2a;
    border-radius: 3px;
    display: none;
    font-size: 11px;
  }
  .eo-output.visible { display: block; }
  .eo-section { margin-bottom: 8px; }
  .eo-section:last-child { margin-bottom: 0; }
  .eo-label {
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .eo-entity {
    display: inline-block;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 2px;
    margin: 2px 3px 2px 0;
    color: var(--text-bright);
    font-size: 11px;
  }
  .eo-kind {
    color: var(--text-dim);
    font-size: 9px;
    margin-left: 4px;
  }
  .eo-entity[data-kind="Void"] { border-color: #666; }
  .eo-entity[data-kind="Entity"] { border-color: #5588aa; }
  .eo-entity[data-kind="Kind"] { border-color: #aa8855; }
  .eo-entity[data-kind="Field"] { border-color: #55aa88; }
  .eo-entity[data-kind="Link"] { border-color: #7788cc; }
  .eo-entity[data-kind="Network"] { border-color: #cc7788; }
  .eo-entity[data-kind="Atmosphere"] { border-color: #8877aa; }
  .eo-entity[data-kind="Lens"] { border-color: #aa55aa; }
  .eo-entity[data-kind="Paradigm"] { border-color: #cc9944; }
  .eo-con {
    padding: 2px 0;
    color: var(--text);
    line-height: 1.5;
  }
  .eo-con-from, .eo-con-to { color: var(--text-bright); }
  .eo-con-rel {
    color: var(--accent);
    font-size: 10px;
    padding: 0 2px;
  }
  .eo-con-ev {
    display: block;
    color: var(--text-dim);
    font-size: 10px;
    padding-left: 12px;
    font-style: italic;
  }
  /* index view */
  .index-toolbar {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
    flex-shrink: 0;
  }
  .index-toolbar .graph-tab {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 10px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
  }
  .index-toolbar .graph-tab.active { color: var(--accent); border-color: var(--accent); }
  .graph-entities {
    width: 280px;
    overflow-y: auto;
    padding: 8px;
    flex-shrink: 0;
  }
  .graph-main { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .lp-caret {
    font-size: 10px;
    margin-right: 2px;
    transition: transform 0.2s;
  }
  .lp-caret.collapsed { transform: rotate(-90deg); }
  .ge-item {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .ge-item:hover { border-color: #555; }
  .ge-item.selected { border-color: var(--accent); background: #1e2a1e; }
  .ge-name { color: var(--text-bright); font-weight: 600; }
  .ge-kind { color: var(--text-dim); font-size: 9px; margin-left: 4px; }
  .ge-def {
    color: var(--text-dim);
    font-size: 10px;
    margin-top: 2px;
    font-style: italic;
  }
  .ge-sources { color: var(--text-dim); font-size: 9px; margin-top: 2px; }
  .ge-detail { font-size: 12px; }
  .ge-detail label {
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin: 10px 0 4px;
  }
  .ge-detail textarea, .ge-detail input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 3px;
    resize: vertical;
  }
  .ge-detail textarea:focus, .ge-detail input:focus {
    outline: 1px solid var(--accent);
    border-color: var(--accent);
  }
  /* walk panel */
  .walk-sentence {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px;
    margin-bottom: 12px;
    font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-bright);
  }
  .walk-progress {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .walk-proposals { margin: 8px 0; }
  .walk-prop {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 4px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 11px;
  }
  .walk-prop-op {
    font-weight: 700;
    color: var(--accent);
    font-size: 10px;
    min-width: 28px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .walk-prop-body { flex: 1; color: var(--text); }
  .walk-prop-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .walk-prop-actions button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 10px;
    padding: 1px 6px;
    cursor: pointer;
    border-radius: 2px;
    font-family: inherit;
  }
  .walk-prop-actions button:hover { color: var(--accent); border-color: var(--accent); }
  .walk-prop.accepted { border-color: var(--accent); opacity: 0.7; }
  .walk-prop.rejected { border-color: #c06060; opacity: 0.4; text-decoration: line-through; }
  .walk-controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .walk-controls button {
    background: var(--surface);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 4px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
  }
  .walk-controls button:hover { background: #1e2a1e; }
  .walk-controls button:disabled { opacity: 0.4; cursor: default; }
  /* app layout */
  #app-layout {
    display: flex;
    min-height: calc(100vh - 60px);
  }
  #left-panel {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  #left-panel .lp-section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  #left-panel .lp-label {
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #left-panel .lp-item {
    padding: 5px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    margin-bottom: 2px;
    color: var(--text);
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  #left-panel .lp-item:hover { background: var(--surface); }
  #left-panel .lp-item.active { background: var(--surface); border-left: 2px solid var(--accent); }
  #left-panel .lp-item .lp-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #left-panel .lp-item .lp-meta {
    font-size: 9px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  #left-panel .lp-item .lp-badge {
    font-size: 8px;
    padding: 0 4px;
    border-radius: 2px;
    white-space: nowrap;
  }
  #left-panel input[type="text"] { width: 100%; margin-bottom: 6px; }
  #left-panel .lp-actions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  #main-content {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  #view-feed {
    flex: 1;
    padding: 0 24px 40px;
    overflow-y: auto;
  }
  #view-index {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .library-scroll {
    flex: 1;
    overflow-y: auto;
  }
</style>
</head>
<body>

<header>
  <h1>{plain text}</h1>
  <div class="controls">
    <input type="text" id="search" placeholder="search..." style="width:180px;" />
    <div style="flex:1;"></div>
    <button class="prompt-toggle" onclick="toggleGraph()" id="graph-toggle"><i class="ph ph-graph"></i> index <span id="graph-count">0</span></button>
    <span id="matrix-status" class="matrix-indicator" onclick="togglePrompt()"></span>
    <button class="prompt-toggle" onclick="togglePrompt()"><i class="ph ph-gear"></i></button>
    <div class="status" id="status"></div>
  </div>
</header>

<div id="prompt-editor">
  <label>matrix storage</label>
  <div id="matrix-login-form">
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" id="mx-homeserver" placeholder="homeserver (e.g. matrix.org)" style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text-bright);font-family:inherit;font-size:12px;padding:6px 10px;border-radius:3px;" />
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" id="mx-user" placeholder="username" style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text-bright);font-family:inherit;font-size:12px;padding:6px 10px;border-radius:3px;" />
      <input type="password" id="mx-pass" placeholder="password" style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text-bright);font-family:inherit;font-size:12px;padding:6px 10px;border-radius:3px;" />
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="act-btn" style="padding:4px 12px;" onclick="matrixLogin()"><i class="ph ph-plug"></i> connect</button>
      <span id="mx-status" style="font-size:11px;color:var(--text-dim);"></span>
    </div>
  </div>
  <div id="matrix-connected" style="display:none;margin-bottom:16px;">
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;">
      <span style="font-size:12px;color:var(--accent);" id="mx-connected-info"></span>
      <button class="act-btn" style="padding:4px 12px;" onclick="matrixLogout()">disconnect</button>
    </div>
    <div id="mx-room-info" style="font-size:11px;color:var(--text-dim);margin-top:6px;"></div>
    <div style="margin-top:8px;">
      <div style="font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">research rooms</div>
      <div id="mx-room-list" style="margin-bottom:6px;"></div>
      <div style="display:flex;gap:4px;">
        <input type="text" id="mx-new-room-name" placeholder="new room name..." style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text-bright);font-family:inherit;font-size:11px;padding:4px 8px;border-radius:3px;" />
        <button class="act-btn" style="padding:3px 8px;font-size:10px;" onclick="matrixCreateNewRoom()"><i class="ph ph-plus"></i></button>
      </div>
    </div>
  </div>

  <label style="margin-top:16px;">anthropic api key</label>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;">
    <input type="password" id="api-key" placeholder="sk-ant-..." style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text-bright);font-family:inherit;font-size:12px;padding:6px 10px;border-radius:3px;" />
    <button class="act-btn" data-label="show" onclick="toggleKeyVis(this)" style="padding:4px 8px;">show</button>
    <span class="prompt-saved" id="key-saved">saved</span>
  </div>
  <label>system prompt for digest generation</label>
  <textarea id="system-prompt"></textarea>
  <div class="prompt-actions">
    <button onclick="saveSettings()">save</button>
    <button onclick="resetPrompt()">reset prompt</button>
    <span class="prompt-saved" id="prompt-saved">saved</span>
  </div>
</div>

<div id="app-layout">

<div id="left-panel">
  <div class="lp-section">
    <div class="lp-label" onclick="toggleLpSection('ingest')" style="cursor:pointer;"><i class="ph ph-caret-down lp-caret" id="caret-ingest"></i><i class="ph ph-plus-circle"></i> ingest</div>
    <div id="section-ingest">
      <input type="text" id="url-ingest" placeholder="paste URL..." />
      <div class="lp-actions">
        <button class="act-btn" style="padding:3px 8px;font-size:10px;" onclick="ingestUrl()"><i class="ph ph-globe"></i> URL</button>
        <label class="act-btn" style="padding:3px 8px;font-size:10px;cursor:pointer;"><i class="ph ph-file-arrow-up"></i> file<input type="file" id="file-ingest" accept=".txt,.md,.html,.pdf" style="display:none;" onchange="ingestFile(event)" /></label>
        <button class="act-btn" style="padding:3px 8px;font-size:10px;" onclick="ingestPaste()"><i class="ph ph-clipboard-text"></i> paste</button>
      </div>
      <span id="ingest-status" style="font-size:10px;color:var(--text-dim);display:block;margin-top:4px;"></span>
    </div>
  </div>

  <div class="lp-section">
    <div class="lp-label" onclick="toggleLpSection('sources')" style="cursor:pointer;"><i class="ph ph-caret-down lp-caret" id="caret-sources"></i><i class="ph ph-rss"></i> feeds</div>
    <div id="section-sources">
      <div id="lp-sources"></div>
      <div style="margin-top:6px;">
        <input type="text" id="add-feed-url" placeholder="RSS feed URL..." style="width:100%;margin-bottom:4px;" />
        <input type="text" id="add-feed-name" placeholder="name..." style="width:100%;margin-bottom:4px;" />
        <button class="act-btn" style="padding:3px 8px;font-size:10px;" onclick="addCustomFeed()"><i class="ph ph-plus"></i> add feed</button>
      </div>
    </div>
  </div>

  <div class="lp-section library-scroll">
    <div class="lp-label" onclick="toggleLpSection('library')" style="cursor:pointer;"><i class="ph ph-caret-down lp-caret" id="caret-library"></i><i class="ph ph-books"></i> library <span id="library-count" style="color:var(--text-dim);">0</span></div>
    <div id="section-library">
      <input type="text" id="library-search" placeholder="search library..." oninput="renderLibrary()" />
      <div id="lp-library"></div>
    </div>
  </div>
</div>

<div id="main-content">
  <div id="view-feed"></div>
  <div id="view-index" style="display:none;">
    <div class="index-toolbar">
      <button class="graph-tab active" id="tab-entities" onclick="graphTab('entities')"><i class="ph ph-map-pin"></i> sites</button>
      <button class="graph-tab" id="tab-connections" onclick="graphTab('connections')"><i class="ph ph-flow-arrow"></i> connections</button>
      <button class="graph-tab" id="tab-walk" onclick="graphTab('walk')"><i class="ph ph-cpu"></i> process</button>

// Find sites in the index that are mentioned in a text (by name or alias)
// Returns only matching sites with their 1-hop connections — minimal context
function findRelevantSites(text) {
  const lower = text.toLowerCase();
  const matched = {};

  for (const [id, e] of Object.entries(graph.entities)) {
    const names = [e.canonical, ...(e.aliases || [])];
    if (names.some(n => n.length > 2 && lower.includes(n.toLowerCase()))) {
      matched[id] = e;
    }
  }

  if (!Object.keys(matched).length) return '';

  const lines = [];
  for (const [id, e] of Object.entries(matched)) {
    let line = '`' + e.canonical + '` (' + id + ', ' + e.kind + ')';
    if (e.hypothesis) line += ': ' + e.hypothesis;
    const cons = graph.connections.filter(c => c.from === id || c.to === id).slice(0, 5);
    if (cons.length) {
      line += '\n  Connections: ' + cons.map(c => {
        const other = c.from === id ? c.to : c.from;
        const otherName = graph.entities[other] ? graph.entities[other].canonical : other;
        return (c.from === id ? '→' : '←') + ' ' + c.relation + ' ' + otherName;
      }).join('; ');
    }
    lines.push(line);
  }

  return 'Known sites referenced in this text:\n' + lines.join('\n');
}

// Convert markdown to HTML for display and clipboard
function mdToHtml(md) {
  const lines = md.split('\n');
  let html = '';
  let inCodeBlock = false;
  let codeBuffer = '';
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // code blocks
    if (line.trim().startsWith('```')) {
      if (inCodeBlock) {
        html += '<pre style="background:#1a1a2e;border:1px solid #333;padding:10px;border-radius:3px;font-size:11px;overflow-x:auto;white-space:pre-wrap;">' + escapeAttr(codeBuffer.trim()) + '</pre>';
        codeBuffer = '';
        inCodeBlock = false;
      } else {
        if (inList) { html += inList === 'ol' ? '</ol>' : '</ul>'; inList = false; }
        inCodeBlock = true;
      }
      continue;
    }
    if (inCodeBlock) { codeBuffer += line + '\n'; continue; }

    // blank lines
    if (!line.trim()) {
      if (inList) { html += inList === 'ol' ? '</ol>' : '</ul>'; inList = false; }
      continue;
    }

    // horizontal rule
    if (line.trim() === '***' || line.trim() === '---') {
      if (inList) { html += inList === 'ol' ? '</ol>' : '</ul>'; inList = false; }
      html += '<hr style="border:none;border-top:1px solid #444;margin:12px 0;">';
      continue;
    }

    // blockquote
    if (line.trim().startsWith('>')) {
      if (inList) { html += inList === 'ol' ? '</ol>' : '</ul>'; inList = false; }
      let quote = line.trim().slice(1).trim();
      // gather continuation lines
      while (i + 1 < lines.length && lines[i + 1].trim() && !lines[i + 1].trim().startsWith('-') && !lines[i + 1].trim().startsWith('```') && !lines[i + 1].trim().startsWith('#')) {
        i++;
        let cont = lines[i].trim();
        if (cont.startsWith('>')) cont = cont.slice(1).trim();
        quote += ' ' + cont;
      }
      quote = inlineFormat(quote);
      html += '<blockquote style="border-left:3px solid #88C070;padding:8px 12px;margin:8px 0;color:#ccc;font-style:italic;">' + quote + '</blockquote>';
      continue;
    }

    // headings
    const headingMatch = line.match(/^(#{1,4})\s+(.+)$/);
    if (headingMatch) {
      if (inList) { html += inList === 'ol' ? '</ol>' : '</ul>'; inList = false; }
      const level = headingMatch[1].length;
      const sizes = { 1: '18px', 2: '15px', 3: '13px', 4: '12px' };
      html += '<div style="font-size:' + sizes[level] + ';font-weight:700;color:var(--text-bright);margin:12px 0 6px;font-family:-apple-system,\'Segoe UI\',Helvetica,sans-serif;">' + inlineFormat(headingMatch[2]) + '</div>';
      continue;
    }

    // bullet list (- or *)
    if (line.trim().startsWith('- ') || (line.trim().startsWith('* ') && !line.trim().startsWith('**'))) {
      if (!inList || inList === 'ol') { if (inList) html += '</ol>'; html += '<ul style="margin:6px 0;padding-left:20px;">'; inList = true; }
      const content = line.trim().startsWith('- ') ? line.trim().slice(2) : line.trim().slice(2);
      html += '<li style="margin-bottom:4px;">' + inlineFormat(content) + '</li>';
      continue;
    }

    // numbered list
    const numMatch = line.trim().match(/^(\d+)\.\s+(.+)$/);
    if (numMatch) {
      if (!inList) { html += '<ol style="margin:6px 0;padding-left:20px;">'; inList = 'ol'; }
      html += '<li style="margin-bottom:4px;">' + inlineFormat(numMatch[2]) + '</li>';
      continue;
    }

    // close list if we hit a non-list line
    if (inList) { html += inList === 'ol' ? '</ol>' : '</ul>'; inList = false; }

    // regular paragraph
    html += '<p style="margin-bottom:8px;">' + inlineFormat(line) + '</p>';
  }

  if (inList) html += inList === 'ol' ? '</ol>' : '</ul>';
  if (inCodeBlock) html += '<pre style="background:#1a1a2e;border:1px solid #333;padding:10px;border-radius:3px;font-size:11px;">' + escapeAttr(codeBuffer.trim()) + '</pre>';

  return html;
}

function inlineFormat(text) {
  let s = escapeAttr(text);
  // bold
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // italic (single *)
  s = s.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  // backtick entities → styled code spans
  s = s.replace(/`([^`]+)`/g, '<code style="background:#2a2a3a;padding:1px 4px;border-radius:2px;color:#88C070;font-size:0.95em;">$1</code>');
  // links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:#88C070;">$1</a>');
  // bare URLs after 🔗
  s = s.replace(/(🔗\s*)(https?:\/\/\S+)/g, '$1<a href="$2" style="color:#88C070;">$2</a>');
  // → arrows
  s = s.replace(/→/g, '<span style="color:#88C070;">→</span>');
  return s;
}

async function matrixSaveFullState() {
  if (!mx.accessToken || !mx.roomId) return;

  try {
    // save graph as state event
    const graphData = { entities: graph.entities, connections: graph.connections, savedAt: new Date().toISOString() };
    const graphJson = JSON.stringify(graphData);

    if (graphJson.length < 60000) {
      // fits in state event
      await mxApi('PUT', '/rooms/' + encodeURIComponent(mx.roomId) + '/state/io.groundtruth.plaintext.graph/', graphData);
    } else {
      // too large — upload as media, store URI in state
      const mxcUri = await matrixUploadJson(graphData, 'plaintext-graph.json');
      if (mxcUri) {
        await mxApi('PUT', '/rooms/' + encodeURIComponent(mx.roomId) + '/state/io.groundtruth.plaintext.graph/', {
          mediaUri: mxcUri,
          siteCount: Object.keys(graph.entities).length,
          connectionCount: graph.connections.length,
          savedAt: new Date().toISOString(),
        });
      }
    }

    // save sources — always use media for full body, state for metadata
    if (sources.length > 0) {
      const mxcUri = await matrixUploadJson(sources, 'plaintext-sources.json');
      await mxApi('PUT', '/rooms/' + encodeURIComponent(mx.roomId) + '/state/io.groundtruth.plaintext.sources/', {
        mediaUri: mxcUri || null,
        count: sources.length,
        index: sources.map(s => ({ id: s.id, title: s.title, url: s.url, processed: s.processed })),
        savedAt: new Date().toISOString(),
      });
    }

    console.log('Matrix save complete:', Object.keys(graph.entities).length, 'sites,', sources.length, 'sources');
  } catch (e) {
    console.error('Matrix save failed:', e);
  }
}

async function matrixUploadJson(data, filename) {

        'Authorization': 'Bearer ' + mx.accessToken,

      body: json,

    console.warn('Media upload failed:', e);

}

  if (!mx.accessToken || !mx.roomId) return;

  accessToken: null,

function mxApi(method, path, body, retries) {
  retries = retries || 0;
  const opts = {
    method,
    headers: { 'Authorization': 'Bearer ' + mx.accessToken, 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(mx.homeserver + '/_matrix/client/v3' + path, opts)
    .then(r => r.json())
    .then(data => {
      if (data.errcode === 'M_LIMIT_EXCEEDED' && retries < 3) {
        const wait = (data.retry_after_ms || 5000) + 1000;
        console.warn('Rate limited, retrying in', wait, 'ms');
        return new Promise(resolve => setTimeout(resolve, wait)).then(() => mxApi(method, path, body, retries + 1));
      }
      return data;
    })
    .catch(err => {
      if (retries < 2) {
        console.warn('Matrix request failed, retrying...', err);
        return new Promise(resolve => setTimeout(resolve, 2000)).then(() => mxApi(method, path, body, retries + 1));
      }
      throw err;
    });
}

async function matrixLogin() {
  const hsInput = document.getElementById('mx-homeserver').value.trim();
  const user = document.getElementById('mx-user').value.trim();
  const pass = document.getElementById('mx-pass').value;

  if (!hsInput || !user || !pass) { setMxStatus('fill all fields', true); return; }

  // normalize homeserver URL
  let hs = hsInput;
  if (!hs.startsWith('http')) hs = 'https://' + hs;
  hs = hs.replace(/\/+$/, '');

  setMxStatus('connecting...');

  try {
    // resolve well-known if needed
    let baseUrl = hs;
    try {
      const wk = await fetch(hs + '/.well-known/matrix/client').then(r => r.json());
      if (wk['m.homeserver'] && wk['m.homeserver'].base_url) {
        baseUrl = wk['m.homeserver'].base_url.replace(/\/+$/, '');
      }
    } catch (e) { /* no well-known, use as-is */ }

    // login
    const loginResp = await fetch(baseUrl + '/_matrix/client/v3/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'm.login.password',
        identifier: { type: 'm.id.user', user: user },
        password: pass,
      }),
    }).then(r => r.json());

    if (loginResp.errcode) {
      setMxStatus(loginResp.error || loginResp.errcode, true);
      return;
    }

    mx.homeserver = baseUrl;
    mx.accessToken = loginResp.access_token;
    mx.userId = loginResp.user_id;

    // persist
    localStorage.setItem('mx_homeserver', baseUrl);
    localStorage.setItem('mx_access_token', mx.accessToken);
    localStorage.setItem('mx_user_id', mx.userId);
    localStorage.setItem('mx_hs_display', hsInput);

    setMxStatus('logged in, finding room...');
    await matrixFindOrCreateRoom();
    showMxConnected();

  } catch (e) {
    console.error('Matrix login error:', e);
    setMxStatus('connection failed: ' + e.message, true);
  }
}

async function matrixFindOrCreateRoom() {
  // list joined rooms and check for our room type
  const joined = await mxApi('GET', '/joined_rooms');
  if (!joined.joined_rooms) return;

  for (const roomId of joined.joined_rooms) {
    try {
      const state = await mxApi('GET', '/rooms/' + encodeURIComponent(roomId) + '/state/' + MX_ROOM_TYPE);
      if (state && !state.errcode) {
        mx.roomId = roomId;
        localStorage.setItem('mx_room_id', roomId);
        return;
      }
    } catch (e) { /* not our room */ }
  }

  // no existing room found — create one
  setMxStatus('creating graph room...');
  const createResp = await mxApi('POST', '/createRoom', {
    name: '{plain text} graph',
    topic: 'EO event graph for {plain text} digest',
    preset: 'private_chat',
    initial_state: [
      {
        type: MX_ROOM_TYPE,
        state_key: '',
        content: {
          version: 1,
          created: new Date().toISOString(),
          format: 'eo-graph',
        },
      },
    ],
  });

  if (createResp.errcode) {
    setMxStatus('room creation failed: ' + (createResp.error || createResp.errcode), true);
    return;
  }

  mx.roomId = createResp.room_id;
  localStorage.setItem('mx_room_id', mx.roomId);
}

function showMxConnected() {
  document.getElementById('matrix-login-form').style.display = 'none';
  document.getElementById('matrix-connected').style.display = 'block';
  document.getElementById('mx-connected-info').textContent = mx.userId;
  document.getElementById('mx-room-info').textContent = mx.roomId
    ? 'active: ' + mx.roomId
    : 'no room selected';
  updateMxIndicator();
  matrixListRooms();
}

async function matrixListRooms() {
  const el = document.getElementById('mx-room-list');
  if (!el || !mx.accessToken) return;

  el.innerHTML = '<span style="color:var(--text-dim);font-size:10px;">scanning...</span>';

  try {
    const joined = await mxApi('GET', '/joined_rooms');
    if (!joined.joined_rooms) { el.innerHTML = ''; return; }

    const rooms = [];
    for (const roomId of joined.joined_rooms) {
      try {
        const state = await mxApi('GET', '/rooms/' + encodeURIComponent(roomId) + '/state/' + MX_ROOM_TYPE);
        if (state && !state.errcode) {
          // get room name
          let name = roomId;
          try {
            const nameState = await mxApi('GET', '/rooms/' + encodeURIComponent(roomId) + '/state/m.room.name/');
            if (nameState && nameState.name) name = nameState.name;
          } catch (e) {}
          rooms.push({ id: roomId, name: name, active: roomId === mx.roomId });
        }
      } catch (e) {}
    }

    if (!rooms.length) {
      el.innerHTML = '<div style="color:var(--text-dim);font-size:10px;">no research rooms found</div>';
      return;
    }

    el.innerHTML = rooms.map(r =>
      '<div class="lp-item' + (r.active ? ' active' : '') + '" onclick="matrixSwitchRoom(\'' + escapeAttr(r.id) + '\')" style="font-size:10px;">' +
        '<i class="ph ph-' + (r.active ? 'folder-open' : 'folder') + '" style="color:var(--accent);"></i> ' +
        '<span class="lp-title">' + escapeAttr(r.name) + '</span>' +
      '</div>'
    ).join('');

  } catch (e) {
    el.innerHTML = '<span style="color:#c06060;font-size:10px;">error listing rooms</span>';
  }
}

async function matrixSwitchRoom(roomId) {
  // save current state to old room first
  await matrixSaveFullState().catch(() => {});

  mx.roomId = roomId;
  localStorage.setItem('mx_room_id', roomId);

  // clear local state and reload from new room
  graph.entities = {};
  graph.connections = [];
  sources = [];
  saveGraph();

  await matrixLoadState();
  renderEntityList();
  renderLibrary();
  if (currentView === 'index') renderGraphPanel();
  showMxConnected();
}

async function matrixCreateNewRoom() {
  const nameInput = document.getElementById('mx-new-room-name');
  const name = nameInput.value.trim() || '{plain text} research';

  try {
    const createResp = await mxApi('POST', '/createRoom', {
      name: name,
      topic: 'EO research room for {plain text}',
      preset: 'private_chat',
      initial_state: [
        { type: MX_ROOM_TYPE, state_key: '', content: { version: 1, created: new Date().toISOString(), format: 'plaintext-research' } },
      ],
    });

    if (createResp.errcode) {
      alert('Room creation failed: ' + (createResp.error || createResp.errcode));

function matrixLogout() {
  // try to invalidate token
  if (mx.accessToken) {
    mxApi('POST', '/logout', {}).catch(() => {});
  }
  mx = { homeserver: null, accessToken: null, userId: null, roomId: null };
  localStorage.removeItem('mx_homeserver');
  localStorage.removeItem('mx_access_token');
  localStorage.removeItem('mx_user_id');
  localStorage.removeItem('mx_room_id');
  localStorage.removeItem('mx_hs_display');

  document.getElementById('matrix-login-form').style.display = 'block';
  document.getElementById('matrix-connected').style.display = 'none';
  document.getElementById('mx-homeserver').value = '';
  document.getElementById('mx-user').value = '';
  document.getElementById('mx-pass').value = '';
  setMxStatus('');
  updateMxIndicator();

async function matrixRestoreSession() {
  const hs = localStorage.getItem('mx_homeserver');
  const token = localStorage.getItem('mx_access_token');
  const userId = localStorage.getItem('mx_user_id');
  const roomId = localStorage.getItem('mx_room_id');
  const hsDisplay = localStorage.getItem('mx_hs_display');

  if (!hs || !token || !userId) {
    updateMxIndicator();
    return;
  }

  mx.homeserver = hs;
  mx.accessToken = token;
  mx.userId = userId;
  mx.roomId = roomId;

  // verify token is still valid
  try {
    const whoami = await mxApi('GET', '/account/whoami');
    if (whoami.errcode) {
      // token expired
      matrixLogout();
      return;
    }

    // if no room, try to find/create
    if (!mx.roomId) {
      await matrixFindOrCreateRoom();
    }

    if (hsDisplay) document.getElementById('mx-homeserver').value = hsDisplay;
    showMxConnected();

  } catch (e) {
    matrixLogout();
  }
}

// --- feed parsing ---

function stripHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || d.innerText || '';
}

function parseDate(str) {
  if (!str) return null;
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

function fmtDate(d) {
  if (!d) return '';
  const now = new Date();
  const diff = now - d;
  const hours = Math.floor(diff / 3600000);
  if (hours < 1) return 'just now';
  if (hours < 24) return hours + 'h ago';
  const days = Math.floor(hours / 24);
  if (days < 7) return days + 'd ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function parseRSS(xml, source) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'text/xml');
  const items = [];

  const rssItems = doc.querySelectorAll('item');
  if (rssItems.length > 0) {
    rssItems.forEach(item => {
      const title = item.querySelector('title')?.textContent?.trim() || '';
      const link = item.querySelector('link')?.textContent?.trim() || '';
      const desc = item.querySelector('description')?.textContent || '';
      const content = item.querySelector('content\\:encoded, encoded')?.textContent || desc;
      const bodyText = stripHTML(content);
      const pubDate = item.querySelector('pubDate')?.textContent || item.querySelector('dc\\:date, date')?.textContent || '';
      items.push({
        title, link,
        snippet: bodyText.slice(0, 600),
        body: bodyText,
        date: parseDate(pubDate),
        source: source.key,
        sourceName: source.name,
        sourceHome: source.home,
      });
    });
    return items;
  }

  const entries = doc.querySelectorAll('entry');
  entries.forEach(entry => {
    const title = entry.querySelector('title')?.textContent?.trim() || '';
    const linkEl = entry.querySelector('link[rel="alternate"], link');
    const link = linkEl?.getAttribute('href') || '';
    const summary = entry.querySelector('summary, content')?.textContent || '';
    const bodyText = stripHTML(summary);
    const published = entry.querySelector('published, updated')?.textContent || '';
    items.push({
      title, link,
      snippet: bodyText.slice(0, 600),
      body: bodyText,
      date: parseDate(published),
      source: source.key,
      sourceName: source.name,
      sourceHome: source.home,
    });
  });

  return items;
}

async function fetchFeed(source) {
  try {
    const resp = await fetch(PROXY + encodeURIComponent(source.url));
    if (!resp.ok) throw new Error(resp.status);
    const text = await resp.text();
    const items = parseRSS(text, source);
    loadedCount++;
    return items;
  } catch (e) {
    errorCount++;
    console.warn(`Failed: ${source.name}`, e);
    return [];
  }
}

// --- claude API ---

async function generateDigest(idx, btn) {
  const item = allItems[idx];
  if (!item) return;

  if (!item._processed) {
    btn.textContent = 'process first';
    btn.classList.add('errored');
    setTimeout(() => { btn.textContent = 'generate'; btn.classList.remove('errored'); }, 2000);
    return;
  }

  const apiKey = getApiKey();
  if (!apiKey) {
    btn.textContent = '✗ no api key';
    btn.classList.add('errored');
    setTimeout(() => { btn.textContent = 'generate'; btn.classList.remove('errored'); }, 2000);
    document.getElementById('prompt-editor').classList.add('open');
    document.getElementById('api-key').focus();
    return;
  }

  btn.textContent = 'generating...';
  btn.classList.remove('copied', 'errored');
  btn.classList.add('generating');
  btn.disabled = true;

  // build context from processed index — entities and connections found in this article
  const articleSites = findRelevantSites(item.body);
  const articleCons = graph.connections
    .filter(c => c.sourceUrl === item.link || c.sourceTitle === item.title)
    .map(c => {
      const fn = graph.entities[c.from]?.canonical || c.from;
      const tn = graph.entities[c.to]?.canonical || c.to;
      return fn + ' →[' + c.relation + ']→ ' + tn + (c.evidence ? ' (' + c.evidence + ')' : '');
    }).join('\n');

  const userMsg = [
    'Headline: ' + item.title,
    'Source: ' + item.sourceName,
    'URL: ' + item.link,
    '',
    articleSites ? 'Indexed sites referenced:\n' + articleSites + '\n' : '',
    articleCons ? 'Connections found in this article:\n' + articleCons + '\n' : '',
    'Full body:',
    item.body.slice(0, 5000),
  ].filter(Boolean).join('\n');

  try {
    const rawOutput = await callClaude(getPrompt(), userMsg, 2000);
    item.generatedRaw = rawOutput;

    // --- substack tab ---
    const substackEl = document.getElementById('out-substack-' + idx);
    substackEl.innerHTML = mdToHtml(rawOutput);

    // --- linked tab (HTML with sentence citations) ---
    const linkedEl = document.getElementById('out-linked-' + idx);
    const sentences = splitSentences(item.body);
    // build sentence-to-site map from walk log
    const sentenceMap = {};
    (item._walkLog || []).forEach(l => {
      if (!sentenceMap[l.sentence]) sentenceMap[l.sentence] = [];
      sentenceMap[l.sentence].push(l);
    });

    let linkedHtml = '<div style="font-size:12px;">';
    linkedHtml += '<div style="margin-bottom:12px;">' + mdToHtml(rawOutput) + '</div>';
    linkedHtml += '<hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">';
    linkedHtml += '<div style="font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;"><i class="ph ph-quotes"></i> source sentences with evidence</div>';
    sentences.forEach((s, si) => {
      const events = sentenceMap[si];
      if (!events || !events.length) return;
      const tags = events.map(e => {
        const color = e.op === 'SIG' ? '#88C070' : e.op === 'DEF' ? '#d4a84d' : e.op === 'CON' ? '#5588aa' : '#888';
        return '<span style="font-size:9px;background:' + color + '22;color:' + color + ';padding:0 4px;border-radius:2px;margin-left:4px;">' + e.op + ' ' + escapeAttr(e.text || e.from || '') + '</span>';
      }).join('');
      linkedHtml += '<div id="s' + si + '" style="padding:4px 0;border-bottom:1px solid var(--border);">';
      linkedHtml += '<span style="color:var(--text-dim);font-size:9px;margin-right:6px;">s' + si + '</span>';
      linkedHtml += '<span style="color:var(--text);">' + escapeAttr(s) + '</span>' + tags;
      linkedHtml += '</div>';
    });
    linkedHtml += '</div>';
    linkedEl.innerHTML = linkedHtml;

    // --- json tab ---
    const jsonEl = document.getElementById('out-json-' + idx);
    const articleJson = {
      title: item.title,
      source: item.sourceName,
      url: item.link,
      date: item.date ? item.date.toISOString() : null,
      digest: rawOutput,
      // the tape: every sentence, immutable
      sentences: sentences.map((s, si) => ({
        idx: si,
        text: s,
        events: (sentenceMap[si] || []).map(e => ({ op: e.op, ref: e.text || e.from || '', span: e.span || s })),
      })),
      // sites found in this article, with span evidence
      sites: Object.entries(graph.entities)
        .filter(([id, e]) => (e.sources || []).some(s => s.url === item.link || s.title === item.title))
        .map(([id, e]) => ({
          id,
          canonical: e.canonical,
          kind: e.kind,
          subtype: e.subtype || null,
          hypothesis: e.hypothesis,
          // every span that grounds this hypothesis — check the tape
          spans: (e.spans || []).filter(sp => sp.sourceUrl === item.link || sp.sourceTitle === item.title)
            .map(sp => ({ sentenceIdx: sp.sentenceIdx, text: sp.text })),
        })),
      // connections found in this article, each linked to its source span
      connections: graph.connections
        .filter(c => c.sourceUrl === item.link || c.sourceTitle === item.title)
        .map(c => ({
          from: c.from,
          to: c.to,
          relation: c.relation,
          evidence: c.evidence,
          confidence: c.confidence,
          // the span cannot lie — this is the actual source sentence
          span: c.span ? { sentenceIdx: c.span.sentenceIdx, text: c.span.text } : null,
        })),
    };
    jsonEl.innerHTML = '<pre style="background:var(--bg);border:1px solid var(--border);padding:8px;border-radius:3px;font-size:10px;max-height:400px;overflow:auto;white-space:pre-wrap;">' + escapeAttr(JSON.stringify(articleJson, null, 2)) + '</pre>';
    item._articleJson = articleJson;

    const outputEl = document.getElementById('output-' + idx);
    outputEl.classList.add('visible');
    showOutputTab(idx, 'substack');

    btn.textContent = '✓ done';
    btn.classList.remove('generating');
    btn.classList.add('copied');
    btn.disabled = false;
    setTimeout(() => { btn.textContent = 'generate'; btn.classList.remove('copied'); }, 2000);

  } catch (e) {
    console.error('Claude API error:', e);
    btn.textContent = '✗ ' + (e.message || 'error');
    btn.classList.remove('generating');
    btn.classList.add('errored');
    btn.disabled = false;
    setTimeout(() => { btn.textContent = 'generate'; btn.classList.remove('errored'); }, 3000);
  }
}

function downloadArticleJson(idx) {
  const item = allItems[idx];
  if (!item || !item._articleJson) return;
  const slug = (item.title || 'article').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 50);
  downloadJson(item._articleJson, slug + '.json');
}

// --- clipboard ---

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.dataset.label;
    btn.textContent = 'copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  });
}

function copyOutput(idx, btn) {
  const item = allItems[idx];
  if (!item || !item.generatedRaw) return;

  // determine which tab is active
  const outputEl = document.getElementById('output-' + idx);
  const substackVisible = document.getElementById('out-substack-' + idx)?.style.display !== 'none';
  const jsonVisible = document.getElementById('out-json-' + idx)?.style.display !== 'none';

  if (jsonVisible && item._articleJson) {
    navigator.clipboard.writeText(JSON.stringify(item._articleJson, null, 2)).then(() => {
      btn.textContent = 'copied json';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = btn.dataset.label; btn.classList.remove('copied'); }, 1500);
    });
    return;
  }

  // for substack and linked, copy as rich text
  const sourceEl = substackVisible
    ? document.getElementById('out-substack-' + idx)
    : document.getElementById('out-linked-' + idx);

  if (!sourceEl) return;

  const tmp = document.createElement('div');
  tmp.style.position = 'fixed';
  tmp.style.left = '-9999px';
  tmp.style.top = '0';
  tmp.style.opacity = '0';
  tmp.innerHTML = sourceEl.innerHTML;
  document.body.appendChild(tmp);

  const range = document.createRange();
  range.selectNodeContents(tmp);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  try {
    document.execCommand('copy');
    btn.textContent = 'copied';
    btn.classList.add('copied');
  } catch (e) {
    btn.textContent = 'copy failed';
  }

  sel.removeAllRanges();
  document.body.removeChild(tmp);
  setTimeout(() => { btn.textContent = btn.dataset.label; btn.classList.remove('copied'); }, 1500);
}

// --- rendering ---

function updateStatus() {
  const s = document.getElementById('status');
  const showing = document.querySelectorAll('.item:not([style*="display: none"])').length;
  let msg = showing + ' items from ' + loadedCount + '/' + SOURCES.length + ' feeds';
  if (errorCount > 0) msg += ' · ' + errorCount + ' failed';
  s.textContent = msg;
}

function renderFilters() { /* handled by left panel */ }

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('#view-feed > .item').forEach(el => {
    const src = el.dataset.source;

function escapeAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
}

          <button class="graph-tab" onclick="showOutputTab(${idx},'json')"><i class="ph ph-brackets-curly"></i> json</button>
        </div>

        <div id="out-linked-${idx}" style="display:none;"></div>

          <button class="act-btn" data-label="regenerate" onclick="generateDigest(${idx}, this)"><i class="ph ph-arrows-clockwise"></i> regenerate</button>

        </div>
      </div>

  });

  updateStatus();

function showOutputTab(idx, tab) {
  ['substack', 'linked', 'json'].forEach(t => {
    const el = document.getElementById('out-' + t + '-' + idx);
    if (el) el.style.display = t === tab ? '' : 'none';
  });
  // highlight tab
  const outputEl = document.getElementById('output-' + idx);
  if (outputEl) {
    outputEl.querySelectorAll('.graph-tab').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.trim().toLowerCase().startsWith(tab.slice(0, 4)));
    });
  }
}

function updateItemProgress(idx, pct) {
  const bar = document.getElementById('progress-bar-' + idx);
  if (bar) bar.style.width = pct + '%';
}

function markItemProcessed(idx) {
  const item = allItems[idx];
  if (item) item._processed = true;
  // update the item UI without full re-render
  const progEl = document.getElementById('progress-' + idx);
  if (progEl) progEl.style.display = 'none';
  const itemEl = document.getElementById('item-' + idx);
  if (itemEl) {
    // enable generate button
    const genBtn = itemEl.querySelector('[data-label="generate"]');
    if (genBtn) { genBtn.disabled = false; genBtn.style.opacity = ''; genBtn.style.cursor = ''; genBtn.title = ''; }
    // add indexed badge
    const srcDiv = itemEl.querySelector('.item-source');
    if (srcDiv && !srcDiv.innerHTML.includes('indexed')) {
      srcDiv.innerHTML += ' <span style="color:var(--accent);font-size:9px;"><i class="ph ph-check-circle"></i> indexed</span>';
    }
  }
  renderLibrary();
}

// --- graph state ---

let graph = {
  entities: {},
  connections: [],
};
let sources = []; // { id, title, url, sourceName, body, date, ingestedAt, sitesFound:[] }
let selectedEntity = null;
let activeGraphTab = 'entities';

// walk state
let walk = {
  active: false,
  paused: false,
  idx: null,
  sentences: [],
  current: 0,
  log: [],
};

function loadGraph() {
  try {
    const saved = localStorage.getItem('plaintext_graph');
    if (saved) graph = JSON.parse(saved);
    const savedSources = localStorage.getItem('plaintext_sources');
    if (savedSources) sources = JSON.parse(savedSources);
  } catch (e) { console.warn('graph load failed', e); }
  updateGraphCount();
}

function saveGraph() {
  localStorage.setItem('plaintext_graph', JSON.stringify(graph));
  localStorage.setItem('plaintext_sources', JSON.stringify(sources));
  updateGraphCount();
  if (mx.accessToken && mx.roomId) scheduleMatrixSave();
}

function updateGraphCount() {
  const el = document.getElementById('graph-count');
  if (el) el.textContent = Object.keys(graph.entities).length;
}

let currentView = 'feed'; // 'feed' or 'index'

function toggleGraph() {
  currentView = currentView === 'feed' ? 'index' : 'feed';
  document.getElementById('view-feed').style.display = currentView === 'feed' ? '' : 'none';
  document.getElementById('view-index').style.display = currentView === 'index' ? '' : 'none';
  const btn = document.getElementById('graph-toggle');
  if (btn) btn.classList.toggle('active', currentView === 'index');
  if (currentView === 'index') renderGraphPanel();
}

function graphTab(tab) {
  activeGraphTab = tab;
  document.querySelectorAll('.index-toolbar .graph-tab, .graph-header .graph-tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab-' + tab);
  if (tabEl) tabEl.classList.add('active');
  renderGraphPanel();
}

// --- graph rendering ---

function renderGraphPanel() {
  renderEntityList();
  const main = document.getElementById('graph-main-content');

  if (activeGraphTab === 'entities') {
    if (selectedEntity && graph.entities[selectedEntity]) {
      renderEntityDetail(selectedEntity);
    } else {
      main.innerHTML = '<div style="color:var(--text-dim);padding:20px;">select a site to view its hypothesis, definition, and connections</div>';
    }
  } else if (activeGraphTab === 'connections') {
    renderConnectionsView();
  } else if (activeGraphTab === 'walk') {
    renderWalkStep();
  }

  // show process indicator on tab if running in background
  const walkTab = document.getElementById('tab-walk');
  if (walk.active && activeGraphTab !== 'walk') {
    walkTab.innerHTML = '<i class="ph ph-cpu"></i> process <span style="color:#d4a84d;">●</span>';
  } else {
    walkTab.innerHTML = '<i class="ph ph-cpu"></i> process';
  }
}

function renderEntityList() {
  const el = document.getElementById('graph-entities-list');
  const searchVal = (document.getElementById('index-search')?.value || '').toLowerCase();
  const sourceFilter = document.getElementById('index-source-filter')?.value || '';

  // populate source dropdown
  const sourceSelect = document.getElementById('index-source-filter');
  if (sourceSelect) {
    const allSources = new Set();
    for (const e of Object.values(graph.entities)) {
      (e.sources || []).forEach(s => { if (s.title) allSources.add(s.title); });
    }
    const currentVal = sourceSelect.value;
    const opts = '<option value="">all sources</option>' +
      [...allSources].sort().map(s => '<option value="' + escapeAttr(s) + '"' + (s === currentVal ? ' selected' : '') + '>' + escapeAttr(s.slice(0, 40)) + '</option>').join('');
    sourceSelect.innerHTML = opts;
  }

  let ids = Object.keys(graph.entities);

  // apply filters
  if (searchVal) {
    ids = ids.filter(id => {
      const e = graph.entities[id];
      return e.canonical.toLowerCase().includes(searchVal) ||
        id.includes(searchVal) ||
        (e.hypothesis || '').toLowerCase().includes(searchVal) ||
        (e.subtype || '').toLowerCase().includes(searchVal) ||
        (e.aliases || []).some(a => a.toLowerCase().includes(searchVal));
    });
  }
  if (sourceFilter) {
    ids = ids.filter(id => {
      const e = graph.entities[id];
      return (e.sources || []).some(s => s.title === sourceFilter);
    });
  }

  if (!ids.length) {
    el.innerHTML = '<div style="color:var(--text-dim);padding:8px;font-size:11px;">' +
      (Object.keys(graph.entities).length ? 'no matches' : 'no sites yet — process an article to begin') + '</div>';
    return;
  }

  // group by terrain
  const terrains = ['Entity','Link','Network','Kind','Field','Void','Atmosphere','Lens','Paradigm'];
  const grouped = {};
  terrains.forEach(t => grouped[t] = []);
  grouped['Other'] = [];
  ids.forEach(id => {
    const t = graph.entities[id].kind || 'Other';
    if (grouped[t]) grouped[t].push(id);
    else grouped['Other'].push(id);
  });

  let html = '';
  terrains.concat(['Other']).forEach(terrain => {
    const group = grouped[terrain];
    if (!group || !group.length) return;
    group.sort((a, b) => graph.entities[a].canonical.localeCompare(graph.entities[b].canonical));

    html += '<div class="lp-label" style="margin-top:8px;cursor:pointer;font-size:9px;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'\':\'none\'">';
    html += '<i class="ph ph-caret-down" style="font-size:8px;"></i> ' + terrain + ' <span style="color:var(--text-dim);">(' + group.length + ')</span></div>';
    html += '<div>';
    group.forEach(id => {
      const e = graph.entities[id];
      const sel = id === selectedEntity ? ' selected' : '';
      const conCount = graph.connections.filter(c => c.from === id || c.to === id).length;
      html += '<div class="ge-item' + sel + '" onclick="selectEntity(\'' + id + '\')">' +
        '<span class="ge-name">' + escapeAttr(e.canonical) + '</span>' +
        (e.subtype ? '<span class="ge-kind">' + e.subtype + '</span>' : '') +
        (conCount ? ' <span class="ge-kind"><i class="ph ph-flow-arrow"></i>' + conCount + '</span>' : '') +
        '</div>';
    });
    html += '</div>';
  });

  el.innerHTML = html;
}

function selectEntity(id) {
  selectedEntity = id;
  activeGraphTab = 'entities';
  document.querySelectorAll('.graph-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-entities').classList.add('active');
  renderGraphPanel();
}

function renderEntityDetail(id) {
  const e = graph.entities[id];
  if (!e) return;

  const main = document.getElementById('graph-main-content');
  const cons = graph.connections.filter(c => c.from === id || c.to === id);

  let html = '<div class="ge-detail">';

  // header
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">';
  html += '<div><span style="font-size:15px;font-weight:700;color:var(--text-bright);">' + escapeAttr(e.canonical) + '</span>';
  html += ' <span class="eo-kind" style="font-size:11px;">' + e.kind + '</span>';
  if (e.segFrom) html += ' <span style="font-size:9px;color:#d4a84d;"><i class="ph ph-scissors"></i> SEG from ' + escapeAttr(e.segFrom) + '</span>';
  html += '</div>';
  html += '<button class="act-btn" onclick="exportSite(\'' + id + '\')"><i class="ph ph-export"></i> export</button>';
  html += '</div>';

  // hypothesis — THE primary field, the system's current understanding
  html += '<label><i class="ph ph-brain"></i> hypothesis — what the system thinks this is</label>';
  html += '<textarea rows="4" style="border-color:#d4a84d;" onchange="updateEntity(\'' + id + '\', \'hypothesis\', this.value)">' + escapeAttr(e.hypothesis || '') + '</textarea>';

  // editable fields
  html += '<div style="display:flex;gap:8px;margin-top:8px;">';
  html += '<div style="flex:1;"><label>canonical name</label>';
  html += '<input type="text" value="' + escapeAttr(e.canonical) + '" onchange="updateEntity(\'' + id + '\', \'canonical\', this.value)" /></div>';
  html += '<div style="width:100px;"><label>terrain</label>';
  html += '<select onchange="updateEntity(\'' + id + '\', \'kind\', this.value)" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text-bright);font-family:inherit;font-size:12px;padding:6px 4px;border-radius:3px;">';
  ['Void','Entity','Kind','Field','Link','Network','Atmosphere','Lens','Paradigm'].forEach(t => {
    html += '<option' + (e.kind === t ? ' selected' : '') + '>' + t + '</option>';
  });
  html += '</select></div>';
  html += '</div>';
  html += '<label>subtype (free text — evolves through DEF/EVA)</label>';
  html += '<input type="text" value="' + escapeAttr(e.subtype || '') + '" placeholder="e.g. organization, person, contract, policy..." onchange="updateEntity(\'' + id + '\', \'subtype\', this.value)" />';
  html += '<label>aliases</label>';
  html += '<input type="text" value="' + escapeAttr((e.aliases || []).join(', ')) + '" onchange="updateEntityAliases(\'' + id + '\', this.value)" />';

  // CON events with feedback
  if (cons.length) {
    html += '<label><i class="ph ph-flow-arrow"></i> connections (' + cons.length + ')</label>';
    cons.forEach((c, ci) => {
      const globalIdx = graph.connections.indexOf(c);
      const other = c.from === id ? c.to : c.from;
      const dir = c.from === id ? '→' : '←';
      const otherName = graph.entities[other] ? graph.entities[other].canonical : other;
      const conf = c.confidence || 'medium';
      const confColor = conf === 'high' ? 'var(--accent)' : conf === 'low' ? '#c06060' : '#d4a84d';
      const fb = c.feedback;

      html += '<div style="padding:4px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start;">';
      html += '<div style="flex:1;">';
      html += '<span style="color:var(--text-bright);">' + dir + '</span> <strong style="color:var(--accent);">' + escapeAttr(c.relation) + '</strong> ';
      html += '<span style="color:var(--text-bright);cursor:pointer;text-decoration:underline;" onclick="selectEntity(\'' + other + '\')">' + escapeAttr(otherName) + '</span>';
      html += ' <span style="font-size:9px;color:' + confColor + ';">' + conf + '</span>';
      if (c.evidence) html += '<div style="font-size:10px;color:var(--text-dim);font-style:italic;">' + escapeAttr(c.evidence) + '</div>';
      if (c.span && c.span.text) html += '<div style="font-size:9px;color:var(--text);background:#1a1a2e;padding:2px 5px;border-radius:2px;border-left:2px solid #5588aa;margin-top:2px;font-style:italic;">"' + escapeAttr(c.span.text.slice(0, 150)) + '"</div>';
      if (c.sourceTitle) html += '<div style="font-size:9px;color:var(--text-dim);"><i class="ph ph-newspaper"></i> ' + escapeAttr(c.sourceTitle) + '</div>';
      if (fb) html += '<div style="font-size:9px;color:#c06060;"><i class="ph ph-chat-dots"></i> ' + escapeAttr(fb) + '</div>';
      html += '</div>';
      html += '<div style="display:flex;gap:2px;flex-shrink:0;">';
      html += '<button class="act-btn" style="padding:1px 4px;font-size:10px;" onclick="feedbackConnection(' + globalIdx + ', true)" title="confirm"><i class="ph ph-check"></i></button>';
      html += '<button class="act-btn" style="padding:1px 4px;font-size:10px;" onclick="promptConnectionFeedback(' + globalIdx + ')" title="correct"><i class="ph ph-pencil"></i></button>';
      html += '<button class="act-btn" style="padding:1px 4px;font-size:10px;color:#c06060;" onclick="deleteConnection(' + globalIdx + ')" title="remove"><i class="ph ph-x"></i></button>';
      html += '</div></div>';
    });
  }

  // DEF history (definition evolution)
  if (e.defHistory && e.defHistory.length > 1) {
    html += '<label><i class="ph ph-clock-counter-clockwise"></i> hypothesis evolution (' + e.defHistory.length + ' revisions)</label>';
    e.defHistory.slice().reverse().forEach((d, i) => {
      html += '<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:10px;">';
      if (d.span) {
        html += '<div style="color:var(--text-dim);font-size:9px;"><i class="ph ph-newspaper"></i> ' + escapeAttr(d.span.sourceTitle || '') + '</div>';
        html += '<div style="color:var(--text);background:#1a1a2e;padding:3px 6px;border-radius:2px;margin:2px 0;border-left:2px solid #5588aa;font-style:italic;">"' + escapeAttr(d.span.text || '') + '"</div>';
      } else if (d.source) {
        html += '<div style="color:var(--text-dim);font-size:9px;"><i class="ph ph-newspaper"></i> ' + escapeAttr(d.source) + '</div>';
      }
      html += '<div style="color:#d4a84d;margin-top:2px;"><i class="ph ph-brain"></i> ' + escapeAttr((d.hypothesis || '').slice(0, 200)) + '</div>';
      html += '</div>';
    });
  }

  // all source spans
  if (e.spans && e.spans.length) {
    html += '<label><i class="ph ph-quotes"></i> source spans (' + e.spans.length + ') — the Given</label>';
    e.spans.forEach(sp => {
      html += '<div style="padding:3px 0;border-bottom:1px solid var(--border);font-size:10px;">';
      html += '<div style="color:var(--text);background:#1a1a2e;padding:3px 6px;border-radius:2px;border-left:2px solid #5588aa;font-style:italic;">"' + escapeAttr(sp.text || '') + '"</div>';
      html += '<div style="color:var(--text-dim);font-size:9px;">' + escapeAttr(sp.sourceTitle || '') + (sp.sourceUrl ? ' · <a href="' + escapeAttr(sp.sourceUrl) + '" target="_blank" style="color:var(--accent);">source</a>' : '') + '</div>';
      html += '</div>';
    });
  }

  // sources
  if (e.sources && e.sources.length) {
    html += '<label><i class="ph ph-newspaper"></i> sources (' + e.sources.length + ')</label>';
    e.sources.forEach(s => {
      html += '<div style="font-size:10px;color:var(--text-dim);margin-bottom:2px;">';
      if (s.url) html += '<a href="' + escapeAttr(s.url) + '" target="_blank" style="color:var(--accent);">' + escapeAttr(s.title || s.url) + '</a>';
      else html += escapeAttr(s.title || '?');
      html += '</div>';
    });
  }

  // user feedback area
  html += '<label><i class="ph ph-chat-dots"></i> your notes</label>';
  html += '<textarea rows="2" placeholder="corrections, context, or notes about this site..." onchange="updateEntity(\'' + id + '\', \'userNotes\', this.value)">' + escapeAttr(e.userNotes || '') + '</textarea>';

  html += '<div style="margin-top:12px;display:flex;gap:8px;">';
  html += '<button class="act-btn" onclick="exportSite(\'' + id + '\')"><i class="ph ph-export"></i> export dossier</button>';
  html += '<button class="act-btn" style="color:#c06060;border-color:#c06060;" onclick="deleteEntity(\'' + id + '\')"><i class="ph ph-trash"></i> delete</button>';
  html += '</div>';

  html += '</div>';
  main.innerHTML = html;
}

function feedbackConnection(idx, confirm) {
  if (graph.connections[idx]) {
    graph.connections[idx].confidence = confirm ? 'high' : 'low';
    graph.connections[idx].feedback = confirm ? 'confirmed by editor' : null;
    saveGraph();
    if (selectedEntity) renderEntityDetail(selectedEntity);
  }
}

function promptConnectionFeedback(idx) {
  const note = prompt('What\'s wrong with this connection? Your correction:');
  if (note !== null && graph.connections[idx]) {
    graph.connections[idx].feedback = note;
    graph.connections[idx].confidence = 'low';
    saveGraph();
    if (selectedEntity) renderEntityDetail(selectedEntity);
  }
}

// --- export ---

function downloadJson(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportSite(id) {
  const e = graph.entities[id];
  if (!e) return;
  const cons = graph.connections.filter(c => c.from === id || c.to === id);

  const data = {
    id,
    canonical: e.canonical,
    kind: e.kind,
    aliases: e.aliases || [],
    hypothesis: e.hypothesis || null,
    segFrom: e.segFrom || null,
    firstSeen: e.firstSeen || null,
    sources: e.sources || [],
    connections: cons.map(c => ({
      direction: c.from === id ? 'outgoing' : 'incoming',
      relation: c.relation,
      target: c.from === id ? c.to : c.from,
      targetName: graph.entities[c.from === id ? c.to : c.from]?.canonical || null,
      evidence: c.evidence || null,
      confidence: c.confidence || null,
      sourceTitle: c.sourceTitle || null,
      sourceUrl: c.sourceUrl || null,
      feedback: c.feedback || null,
    })),
    hypothesisEvolution: (e.defHistory || []).map(d => ({
      hypothesis: d.hypothesis || d.def || '',
      source: d.source || null,
      timestamp: d.ts || null,
    })),
    userNotes: e.userNotes || null,
  };

  downloadJson(data, id + '.json');
}

function exportAllSites() {
  const data = {
    exportDate: new Date().toISOString(),
    format: 'plaintext-index-v1',
    sites: Object.entries(graph.entities).map(([id, e]) => ({
      id,
      canonical: e.canonical,
      terrain: e.kind,
      subtype: e.subtype || null,
      aliases: e.aliases || [],
      hypothesis: e.hypothesis || null,
      sources: e.sources || [],
      firstSeen: e.firstSeen || null,
      segFrom: e.segFrom || null,
      userNotes: e.userNotes || null,
      spans: (e.spans || []).map(sp => ({
        text: sp.text,
        sourceUrl: sp.sourceUrl,
        sourceTitle: sp.sourceTitle,
        sentenceIdx: sp.sentenceIdx,
      })),
      hypothesisEvolution: (e.defHistory || []).map(d => ({
        hypothesis: d.hypothesis || d.def || '',
        span: d.span ? { text: d.span.text, sourceUrl: d.span.sourceUrl, sourceTitle: d.span.sourceTitle } : null,
        timestamp: d.ts || null,
      })),
    })),
    connections: graph.connections.map(c => ({
      from: c.from,
      to: c.to,
      relation: c.relation,
      evidence: c.evidence || null,
      confidence: c.confidence || null,
      span: c.span ? { text: c.span.text, sourceUrl: c.span.sourceUrl, sourceTitle: c.span.sourceTitle } : null,
      sourceTitle: c.sourceTitle || null,
      sourceUrl: c.sourceUrl || null,
      feedback: c.feedback || null,
    })),
    sources: sources,
  };

  downloadJson(data, 'plaintext-index-' + new Date().toISOString().slice(0, 10) + '.json');
}

function updateEntity(id, field, value) {
  if (graph.entities[id]) {
    graph.entities[id][field] = value;
    saveGraph();
    renderEntityList();
  }
}

function updateEntityAliases(id, value) {
  if (graph.entities[id]) {
    graph.entities[id].aliases = value.split(',').map(s => s.trim()).filter(Boolean);
    saveGraph();
  }
}

function deleteEntity(id) {
  delete graph.entities[id];
  graph.connections = graph.connections.filter(c => c.from !== id && c.to !== id);
  selectedEntity = null;
  saveGraph();
  renderGraphPanel();
}

function renderConnectionsView() {
  const main = document.getElementById('graph-main-content');
  if (!graph.connections.length) {
    main.innerHTML = '<div style="color:var(--text-dim);padding:20px;">no connections yet</div>';
    return;
  }

  const html = graph.connections.map((c, i) => {
    const fromName = graph.entities[c.from] ? graph.entities[c.from].canonical : c.from;
    const toName = graph.entities[c.to] ? graph.entities[c.to].canonical : c.to;
    return '<div class="walk-prop">' +
      '<div class="walk-prop-op">CON</div>' +
      '<div class="walk-prop-body">' +
        '<strong>' + escapeAttr(fromName) + '</strong>' +
        ' <span style="color:var(--accent);">' + escapeAttr(c.relation) + '</span> ' +
        '<strong>' + escapeAttr(toName) + '</strong>' +
        (c.evidence ? '<div style="font-size:10px;color:var(--text-dim);font-style:italic;">' + escapeAttr(c.evidence) + '</div>' : '') +
        (c.sourceTitle ? '<div style="font-size:9px;color:var(--text-dim);">from: ' + escapeAttr(c.sourceTitle) + '</div>' : '') +
      '</div>' +
      '<div class="walk-prop-actions"><button onclick="deleteConnection(' + i + ')"><i class="ph ph-x"></i></button></div>' +
      '</div>';

  main.innerHTML = html;

function deleteConnection(i) {
  graph.connections.splice(i, 1);
  saveGraph();
  renderGraphPanel();
}

// --- source management ---

function addSource(title, url, sourceName, body, date) {
  const id = 'src-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
  const src = {
    id,
    title: title || '(untitled)',
    url: url || null,
    sourceName: sourceName || 'manual',
    body: body,
    date: date || new Date().toISOString(),
    ingestedAt: new Date().toISOString(),
    sitesFound: [],
    processed: false,
  };
  sources.unshift(src);
  saveGraph();

  // also add to allItems so it appears in the feed and can be processed/generated
  allItems.unshift({
    title: src.title,
    link: src.url || '',
    snippet: body.slice(0, 600),
    body: body,
    date: new Date(src.date),
    source: 'manual',
    sourceName: src.sourceName,
    sourceHome: src.url || '',
    _sourceId: id,
  });
  renderItems();
  renderLibrary();

  return id;
}

async function ingestUrl() {
  const urlInput = document.getElementById('url-ingest');
  const url = urlInput.value.trim();
  if (!url) return;

  const statusEl = document.getElementById('ingest-status');
  statusEl.textContent = 'fetching...';

  try {
    const resp = await fetch(PROXY + encodeURIComponent(url));
    if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
    const html = await resp.text();

    // extract text from HTML
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // try to get title
    const title = doc.querySelector('title')?.textContent?.trim() ||
      doc.querySelector('h1')?.textContent?.trim() || url;
    // get body text — prefer article/main, fallback to body
    const contentEl = doc.querySelector('article') || doc.querySelector('main') || doc.querySelector('.post-content') || doc.body;
    const body = contentEl?.textContent?.replace(/\s+/g, ' ')?.trim() || '';

    if (body.length < 50) {
      statusEl.textContent = 'too little content extracted';
      return;
    }

    addSource(title, url, new URL(url).hostname, body);
    urlInput.value = '';
    statusEl.textContent = '✓ ingested (' + body.length + ' chars)';
    setTimeout(() => { statusEl.textContent = ''; }, 3000);

  } catch (e) {
    statusEl.textContent = '✗ ' + e.message;
    setTimeout(() => { statusEl.textContent = ''; }, 5000);
  }
}

function ingestFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('ingest-status');

  const reader = new FileReader();
  reader.onload = function(e) {
    let body = e.target.result;

    // if HTML, extract text
    if (file.name.endsWith('.html') || file.name.endsWith('.htm')) {
      const doc = new DOMParser().parseFromString(body, 'text/html');
      body = doc.body?.textContent?.replace(/\s+/g, ' ')?.trim() || body;
    }

    addSource(file.name.replace(/\.\w+$/, ''), null, 'file: ' + file.name, body);
    statusEl.textContent = '✓ ' + file.name + ' ingested';
    setTimeout(() => { statusEl.textContent = ''; }, 3000);
    event.target.value = '';
  };
  reader.readAsText(file);
}

function ingestPaste() {
  const text = prompt('Paste text to ingest:');
  if (!text || text.length < 20) return;
  const title = prompt('Title for this source:', text.slice(0, 60) + '...');
  addSource(title || 'Pasted text', null, 'paste', text);
  document.getElementById('ingest-status').textContent = '✓ pasted text ingested';

}

function renderSourcesView() {

      '<div style="font-size:9px;color:var(--text-dim);">' + new Date(s.ingestedAt).toLocaleDateString() + '</div>' +
