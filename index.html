function viewSource(idx) {
  const s = sources[idx];
  if (!s) return;
  const main = document.getElementById('graph-main-content');

  // find sites that reference this source
  const linkedSites = Object.entries(graph.entities)
    .filter(([id, e]) => (e.sources || []).some(src => src.url === s.url || src.title === s.title))
    .map(([id, e]) => ({ id, canonical: e.canonical, kind: e.kind }));

  let html = '<div class="ge-detail">';
  html += '<div style="font-size:14px;font-weight:700;color:var(--text-bright);margin-bottom:8px;">' + escapeAttr(s.title) + '</div>';
  html += '<div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">' + escapeAttr(s.sourceName || '') + ' · ' + new Date(s.ingestedAt).toLocaleDateString() + '</div>';
  if (s.url) html += '<div style="font-size:11px;margin-bottom:8px;"><a href="' + escapeAttr(s.url) + '" target="_blank" style="color:var(--accent);">' + escapeAttr(s.url) + '</a></div>';

  if (linkedSites.length) {
    html += '<label><i class="ph ph-map-pin"></i> linked sites (' + linkedSites.length + ')</label>';
    html += linkedSites.map(ls =>
      '<span class="eo-entity" data-kind="' + ls.kind + '" onclick="selectEntity(\'' + ls.id + '\')" style="cursor:pointer;">' +
      escapeAttr(ls.canonical) + '<span class="eo-kind">' + ls.kind + '</span></span>'
    ).join(' ');
  }

  html += '<label><i class="ph ph-article"></i> content preview</label>';
  html += '<div style="max-height:300px;overflow-y:auto;font-size:11px;color:var(--text);line-height:1.6;background:var(--bg);padding:8px;border-radius:3px;">' + escapeAttr(s.body.slice(0, 3000)) + '</div>';

  html += '<div style="margin-top:12px;display:flex;gap:8px;">';
  // find the allItems entry for this source
  const itemIdx = allItems.findIndex(it => it._sourceId === s.id || (s.url && it.link === s.url));
  if (itemIdx >= 0) {
    html += '<button class="act-btn" onclick="startWalk(' + itemIdx + ')"><i class="ph ph-cpu"></i> process</button>';
  }
  html += '<button class="act-btn" style="color:#c06060;border-color:#c06060;" onclick="deleteSource(' + idx + ')"><i class="ph ph-trash"></i> delete</button>';
  html += '</div></div>';

  main.innerHTML = html;
}

function deleteSource(idx) {
  sources.splice(idx, 1);
  saveGraph();
  renderSourcesView();
}

// --- walk system ---

const WALK_PROMPT = `You are an EO (Emergent Ontology) reader processing text clause by clause, building a knowledge index.

You receive:
- A single sentence from an article
- The article's title and source for context
- A compact index of all known site IDs (so you can reference existing sites without re-SIGing them)
- For sites mentioned in this sentence: their current hypothesis and connections (targeted context, not the full index)

Each site is classified by which of the nine EO terrains it occupies:

Void — something absent that should be present (missing oversight, absent records, unmet requirements)
Entity — a specific identifiable thing (a person, an organization, a document, a program)
Kind — a type or category of thing (private policing, sole-source contracting, business improvement districts)
Field — a domain of activity or jurisdiction (surveillance, public safety, procurement, housing)
Link — a specific connection between things (a contract, an appointment, a funding stream)
Network — a system of connections (a funding web, an organizational chain, a revolving door)
Atmosphere — an ambient condition (institutional opacity, culture of non-response, climate of retaliation)
Lens — a frame through which things are interpreted (how "safety" gets operationalized, how "accountability" gets redefined)
Paradigm — a governing structural framework (privatization of public functions, conversion of oversight into discretion)

For this sentence, return a JSON array of EO events:

[
  {"op": "SIG", "id": "slug-id", "canonical": "Display Name", "site": "Entity", "subtype": "organization", "aliases": ["NDP"], "hypothesis": "what this is and what role it plays"},
  {"op": "DEF", "id": "existing-slug-id", "hypothesis": "REVISED full hypothesis incorporating new evidence", "subtype": "updated if evidence changes what kind of thing this is"},
  {"op": "CON", "from": "slug-a", "to": "slug-b", "relation": "relation_type", "evidence": "textual evidence", "confidence": "high|medium|low"},
  {"op": "SEG", "id": "original-slug-id", "into": [{"id": "new-a", "canonical": "Name A", "site": "Entity", "subtype": "org", "hypothesis": "..."}], "reason": "why this is actually multiple distinct things"}
]

SIG: genuinely new site not in register. Classify by terrain. The hypothesis answers: what is this, what does it do, what role does it play?
DEF: a known site reappears and the sentence adds new evidence. Rewrite the FULL hypothesis. Update the subtype if warranted. The hypothesis should deepen, not just append.
CON: a relationship evidenced in text. Include confidence.
SEG: when one site is actually multiple distinct things.

Relations: funds, contracts_with, employs, oversees, opposes, collaborates_with, owns, operates, investigates, regulates, surveils, located_in, member_of, subsidiary_of, lobbies, procures, related_to, created_by.
Slug IDs: lowercase-hyphenated. Only what the sentence evidences. Empty array [] if nothing new.
Output ONLY the JSON array.`;

function splitSentences(text) {
  return text
    .replace(/\n{2,}/g, '\n')
    .split(/(?<=[.!?])\s+(?=[A-Z"'"])/)
    .map(s => s.trim())
    .filter(s => s.length > 10);
}

// build targeted context: only sites mentioned in this sentence + their 1-hop neighborhood
function buildSentenceContext(sentence) {
  const lower = sentence.toLowerCase();
  const matched = new Set();

  // find sites mentioned by name or alias
  for (const [id, e] of Object.entries(graph.entities)) {
    const names = [e.canonical, ...(e.aliases || [])];
    if (names.some(n => n.length > 2 && lower.includes(n.toLowerCase()))) {
      matched.add(id);
      // add 1-hop neighbors
      graph.connections.filter(c => c.from === id || c.to === id).forEach(c => {
        matched.add(c.from === id ? c.to : c.from);
      });
    }
  }

  if (!matched.size) return '';

  const lines = [];
  for (const id of matched) {
    const e = graph.entities[id];
    if (!e) continue;
    let line = id + ' (' + e.kind + '): ' + e.canonical;
    if (e.aliases && e.aliases.length) line += ' [aliases: ' + e.aliases.join(', ') + ']';
    if (e.hypothesis) line += '\n  Hypothesis: ' + e.hypothesis;
    const cons = graph.connections.filter(c => (c.from === id || c.to === id) && (matched.has(c.from) || matched.has(c.to)));
    if (cons.length) {
      cons.forEach(c => {
        const other = c.from === id ? c.to : c.from;
        const otherName = graph.entities[other] ? graph.entities[other].canonical : other;
        line += '\n  ' + (c.from === id ? '→' : '←') + ' ' + c.relation + ' ' + otherName;
      });
    }
    lines.push(line);
  }

  return lines.join('\n\n');
}

async function startWalk(idx) {
  const item = allItems[idx];
  if (!item) { console.error('No item at index', idx); return; }

  const apiKey = getApiKey();
  if (!apiKey) {
    alert('Set your Anthropic API key in settings first');
    document.getElementById('prompt-editor').classList.add('open');
    return;
  }

  if (!item.body || item.body.length < 50) {
    alert('Article body too short to process');
    return;
  }

  // switch to index view on walk tab
  if (currentView !== 'index') toggleGraph();
  graphTab('walk');

  walk.active = true;
  walk.paused = false;
  walk.idx = idx;
  walk.sentences = splitSentences(item.body);
  walk.current = 0;
  walk.log = [];

  renderWalkStep();
  runWalk();
}

async function runWalk() {
  while (walk.active && !walk.paused && walk.current < walk.sentences.length) {
    // update progress bar on the feed item
    const pct = Math.round(((walk.current + 1) / walk.sentences.length) * 100);
    updateItemProgress(walk.idx, pct);

    await processAndAccept();
    walk.current++;
    if (activeGraphTab === 'walk') renderWalkStep();
    renderEntityList();
    const walkTab = document.getElementById('tab-walk');
    if (walkTab && activeGraphTab !== 'walk') {
      walkTab.innerHTML = '<i class="ph ph-cpu"></i> process <span style="color:#d4a84d;">●</span>';
    }
  }

  if (walk.active && walk.current >= walk.sentences.length) {
    walk.active = false;
    // store walk log on the item for linked output
    if (walk.idx != null && allItems[walk.idx]) {
      allItems[walk.idx]._walkLog = [...walk.log];
    }
    markItemProcessed(walk.idx);
    storeWalkToMatrix();
    if (activeGraphTab === 'walk') renderWalkStep();
    const walkTab = document.getElementById('tab-walk');
    if (walkTab) walkTab.innerHTML = '<i class="ph ph-cpu"></i> process';
  }
}

async function processAndAccept() {
  const item = allItems[walk.idx];
  const sentence = walk.sentences[walk.current];
  const siteContext = buildSentenceContext(sentence);

  // also include a compact list of ALL site IDs so Claude can reference existing ones
  const siteIndex = Object.keys(graph.entities).length
    ? 'All indexed sites: ' + Object.keys(graph.entities).map(id => id + '=' + graph.entities[id].canonical).join(', ')
    : '';

  const userMsg = [
    'Article: ' + item.title + ' (' + item.sourceName + ')',
    '',
    siteIndex,
    siteContext ? '\nRelevant sites for this sentence:\n' + siteContext : '',
    '\nSentence to process:',
    sentence,
  ].filter(Boolean).join('\n');

  try {
    const raw = await callClaude(WALK_PROMPT, userMsg, 1500);
    const clean = raw.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
    const proposals = JSON.parse(clean);
    if (!Array.isArray(proposals)) return;

    // auto-accept all — every event carries the source span mechanically
    const span = sentence; // immutable: the actual source text at this cursor
    const spanMeta = { text: span, sentenceIdx: walk.current, sourceUrl: item.link, sourceTitle: item.title };

    for (const p of proposals) {
      if (p.op === 'SIG' && p.id && !graph.entities[p.id]) {
        graph.entities[p.id] = {
          canonical: p.canonical || p.id,
          kind: p.site || p.kind || 'Entity',
          subtype: p.subtype || '',
          aliases: p.aliases || [],
          hypothesis: p.hypothesis || '',
          sources: [{ title: item.title, url: item.link }],
          firstSeen: new Date().toISOString(),
          defHistory: [{ hypothesis: p.hypothesis || '', span: spanMeta, ts: new Date().toISOString() }],
          spans: [spanMeta],
          feedback: [],
        };
        walk.log.push({ op: 'SIG', text: p.canonical || p.id, kind: p.site || p.kind, sentence: walk.current, span: span });
      } else if (p.op === 'DEF' && p.id && graph.entities[p.id]) {
        const ent = graph.entities[p.id];
        const oldHyp = ent.hypothesis || '';
        ent.hypothesis = p.hypothesis || oldHyp;
        if (p.subtype) ent.subtype = p.subtype;
        if (!ent.defHistory) ent.defHistory = [];
        ent.defHistory.push({ hypothesis: p.hypothesis || '', span: spanMeta, ts: new Date().toISOString() });
        if (!ent.spans) ent.spans = [];
        ent.spans.push(spanMeta);
        if (p.aliases) {
          const existing = new Set((ent.aliases || []).map(a => a.toLowerCase()));
          p.aliases.forEach(a => { if (!existing.has(a.toLowerCase())) (ent.aliases = ent.aliases || []).push(a); });
        }
        const srcs = ent.sources || [];
        if (!srcs.some(s => s.url === item.link)) srcs.push({ title: item.title, url: item.link });
        walk.log.push({ op: 'DEF', text: ent.canonical, hyp: p.hypothesis, sentence: walk.current, span: span });
      } else if (p.op === 'CON' && p.from && p.to) {
        const exists = graph.connections.some(c => c.from === p.from && c.to === p.to && c.relation === p.relation);
        if (!exists) {
          graph.connections.push({
            from: p.from, to: p.to,
            relation: p.relation || 'related_to',
            evidence: p.evidence || '',
            confidence: p.confidence || 'medium',
            span: spanMeta, // the actual source sentence — cannot lie
            sourceUrl: item.link,
            sourceTitle: item.title,
            feedback: null,
          });
          walk.log.push({ op: 'CON', from: p.from, to: p.to, rel: p.relation, sentence: walk.current, span: span });
        }
      } else if (p.op === 'SEG' && p.id && p.into && Array.isArray(p.into) && graph.entities[p.id]) {
        // split one site into multiple
        const original = graph.entities[p.id];
        const oldCons = graph.connections.filter(c => c.from === p.id || c.to === p.id);

        p.into.forEach(newSite => {
          if (!newSite.id) return;
          graph.entities[newSite.id] = {
            canonical: newSite.canonical || newSite.id,
            kind: newSite.site || newSite.kind || original.kind,
            subtype: newSite.subtype || '',
            aliases: newSite.aliases || [],
            hypothesis: newSite.hypothesis || '',
            sources: [...(original.sources || [])],
            firstSeen: new Date().toISOString(),
            defHistory: [
              { hypothesis: 'SEG from ' + original.canonical + ': ' + (p.reason || ''), span: spanMeta, ts: new Date().toISOString() },
              { hypothesis: newSite.hypothesis || '', span: spanMeta, ts: new Date().toISOString() },
            ],
            spans: [...(original.spans || []), spanMeta],
            feedback: [],
            segFrom: p.id,
          };
        });

        // reassign connections: duplicate to first new site (user can fix)
        if (p.into.length > 0) {
          oldCons.forEach(c => {
            const nc = { ...c };
            if (nc.from === p.id) nc.from = p.into[0].id;
            if (nc.to === p.id) nc.to = p.into[0].id;
            graph.connections.push(nc);
          });
        }

        // remove original
        delete graph.entities[p.id];
        graph.connections = graph.connections.filter(c => c.from !== p.id && c.to !== p.id);

        walk.log.push({ op: 'SEG', text: original.canonical, into: p.into.map(s => s.canonical).join(', '), sentence: walk.current });
      }
    }

    saveGraph();

  } catch (e) {
    console.warn('Walk sentence error:', e);
    walk.log.push({ op: 'ERR', text: e.message, sentence: walk.current });
  }
}

function storeWalkToMatrix() {
  if (!mx.accessToken || !mx.roomId) return;
  const item = allItems[walk.idx];

  // gather all events from the walk
  const events = walk.log
    .filter(l => l.op !== 'ERR')
    .map(l => {
      if (l.op === 'SIG') return { op: 'SIG', site: 'entity:' + l.text, resolution: { kind: l.kind } };
      if (l.op === 'DEF') return { op: 'DEF', site: 'entity:' + l.text, resolution: { hypothesis: l.hyp || l.def } };
      if (l.op === 'CON') return { op: 'CON', site: 'entity:' + l.from, resolution: { joined: 'entity:' + l.to, relation: l.rel } };
      if (l.op === 'SEG') return { op: 'SEG', site: 'entity:' + l.text, resolution: { into: l.into } };
      return null;
    })
    .filter(Boolean);

  if (events.length) {
    matrixSendEoBatch(events, {
      title: item.title,
      url: item.link,
      source: item.sourceName,
      walkSentences: walk.sentences.length,
    }).catch(e => console.warn('matrix batch store failed', e));
  }
}

function renderWalkStep() {
  const main = document.getElementById('graph-main-content');
  const item = walk.idx != null ? allItems[walk.idx] : null;

  if (!walk.active && !walk.log.length) {
    main.innerHTML = '<div style="color:var(--text-dim);padding:20px;"><i class="ph ph-cpu" style="font-size:16px;"></i> click <strong>process</strong> on any article to begin clause-by-clause indexing</div>';
    return;
  }

  let html = '';

  if (item) {
    const pct = walk.sentences.length ? Math.round(((walk.current) / walk.sentences.length) * 100) : 0;
    html += '<div class="walk-progress"><i class="ph ph-article"></i> ' + escapeAttr(item.title) + ' — ' +
      (walk.active ? 'sentence ' + (walk.current + 1) + '/' + walk.sentences.length + ' (' + pct + '%)' : '<i class="ph ph-check-circle"></i> complete') +
      '</div>';

    // progress bar
    html += '<div style="background:var(--border);height:3px;border-radius:2px;margin-bottom:12px;">' +
      '<div style="background:var(--accent);height:3px;border-radius:2px;width:' + pct + '%;transition:width 0.3s;"></div></div>';
  }

  // current sentence
  if (walk.active && walk.sentences[walk.current]) {
    html += '<div class="walk-sentence">' + escapeAttr(walk.sentences[walk.current]) + '</div>';
  }

  // controls
  html += '<div class="walk-controls">';
  if (walk.active) {
    if (walk.paused) {
      html += '<button onclick="walk.paused=false;runWalk();"><i class="ph ph-play"></i> resume</button>';
    } else {
      html += '<button onclick="walk.paused=true;" style="border-color:#d4a84d;color:#d4a84d;"><i class="ph ph-pause"></i> pause</button>';
    }
    html += '<button onclick="endWalk()" style="border-color:var(--text-dim);color:var(--text-dim);"><i class="ph ph-stop"></i> stop</button>';
  } else if (walk.log.length) {
    html += '<button onclick="graphTab(\'entities\')"><i class="ph ph-map-pin"></i> review sites</button>';
  }
  html += '</div>';

  // event log (scrolls, newest first)
  if (walk.log.length) {
    html += '<div style="margin-top:12px;max-height:300px;overflow-y:auto;">';
    for (let i = walk.log.length - 1; i >= 0; i--) {
      const l = walk.log[i];
      let line = '';
      if (l.op === 'SIG') {
        line = '<span class="walk-prop-op">SIG</span> <strong>' + escapeAttr(l.text) + '</strong> <span class="eo-kind">' + (l.kind || '') + '</span>';
      } else if (l.op === 'DEF') {
        line = '<span class="walk-prop-op">DEF</span> <strong>' + escapeAttr(l.text) + '</strong>: <span style="color:var(--text-dim);font-size:10px;">' + escapeAttr((l.hyp || l.def || '').slice(0, 100)) + '</span>';
      } else if (l.op === 'CON') {
        line = '<span class="walk-prop-op">CON</span> ' + escapeAttr(l.from) + ' <span style="color:var(--accent);">' + escapeAttr(l.rel || '') + '</span> ' + escapeAttr(l.to);
      } else if (l.op === 'SEG') {
        line = '<span class="walk-prop-op" style="color:#d4a84d;">SEG</span> <i class="ph ph-scissors"></i> <strong>' + escapeAttr(l.text) + '</strong> → ' + escapeAttr(l.into || '');
      } else if (l.op === 'ERR') {
        line = '<span style="color:#c06060;">ERR</span> ' + escapeAttr(l.text || '');
      }
      html += '<div style="padding:2px 0;font-size:11px;border-bottom:1px solid var(--border);">' +
        '<span style="color:var(--text-dim);font-size:9px;margin-right:6px;">s' + l.sentence + '</span>' + line + '</div>';
    }
    html += '</div>';
  }

  main.innerHTML = html;
}

function endWalk() {
  walk.active = false;
  walk.paused = false;
  storeWalkToMatrix();

  // mark source as processed if it exists
  const item = walk.idx != null ? allItems[walk.idx] : null;
  if (item) {
    const srcIdx = sources.findIndex(s => s.id === item._sourceId || (item.link && s.url === item.link));
    if (srcIdx >= 0) {
      sources[srcIdx].processed = true;
      sources[srcIdx].sitesFound = walk.log.filter(l => l.op === 'SIG').map(l => l.text);
    }
    // also add source record if it came from a feed (not manually ingested)
    if (srcIdx < 0 && item.link) {
      sources.unshift({
        id: 'src-' + Date.now(),
        title: item.title,
        url: item.link,
        sourceName: item.sourceName,
        body: (item.body || '').slice(0, 10000),
        date: item.date ? item.date.toISOString() : new Date().toISOString(),
        ingestedAt: new Date().toISOString(),
        sitesFound: walk.log.filter(l => l.op === 'SIG').map(l => l.text),
        processed: true,
      });
    }
    saveGraph();
  }

  renderWalkStep();
}

// --- init ---

async function init() {
  loadSettings();
  loadGraph();
  loadCustomFeeds();
  customFeeds.forEach(f => SOURCES.push(f));
  renderSourcesList();
  matrixRestoreSession().then(() => {
    if (mx.accessToken && mx.roomId) matrixLoadState().then(() => {
      renderLibrary();
      if (currentView === 'index') renderGraphPanel();
    });
  });
  const results = await Promise.all(SOURCES.map(fetchFeed));
  allItems = results.flat();
  renderItems();
  renderLibrary();
  document.getElementById('search').addEventListener('input', applyFilters);
}

function renderSourcesList() {
  const el = document.getElementById('lp-sources');
  if (!el) return;
  let html = '<div class="lp-item' + (activeFilters.size === 0 ? ' active' : '') + '" onclick="filterBySource(null)">' +
    '<i class="ph ph-list" style="color:var(--text-dim);flex-shrink:0;margin-top:2px;"></i>' +
    '<span class="lp-title">all feeds</span></div>';
  html += SOURCES.map(s =>
    '<div class="lp-item' + (activeFilters.has(s.key) ? ' active' : '') + '" onclick="filterBySource(\'' + s.key + '\')">' +
      '<i class="ph ph-rss" style="color:var(--accent);flex-shrink:0;margin-top:2px;"></i>' +
      '<span class="lp-title">' + escapeAttr(s.name) + '</span>' +
    '</div>'
  ).join('');
  el.innerHTML = html;
}

function filterBySource(key) {
  activeFilters.clear();
  if (key) activeFilters.add(key);
  applyFilters();
  renderSourcesList();
}

function renderLibrary() {
  const el = document.getElementById('lp-library');
  const countEl = document.getElementById('library-count');
  if (!el) return;

  const searchVal = (document.getElementById('library-search')?.value || '').toLowerCase();

  // library = sources array (manually ingested) + processed feed items
  let items = [];

  // add persisted sources
  sources.forEach((s, i) => {
    items.push({
      title: s.title,
      sourceName: s.sourceName,
      date: s.ingestedAt,
      processed: s.processed,
      type: 'source',
      idx: i,
      url: s.url,
    });
  });

  // add processed feed items not already in sources
  allItems.forEach((item, i) => {
    if (!item._processed) return;
    const alreadyInSources = sources.some(s => s.url === item.link || s.title === item.title);
    if (alreadyInSources) return;
    items.push({
      title: item.title,
      sourceName: item.sourceName,
      date: item.date ? item.date.toISOString() : '',
      processed: true,
      type: 'feed',
      idx: i,
      url: item.link,
    });
  });

  // sort newest first
  items.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

  // filter
  if (searchVal) {
    items = items.filter(it => (it.title || '').toLowerCase().includes(searchVal) || (it.sourceName || '').toLowerCase().includes(searchVal));
  }

  if (countEl) countEl.textContent = items.length;

  if (!items.length) {
    el.innerHTML = '<div style="color:var(--text-dim);font-size:10px;padding:4px;">no content yet</div>';
    return;
  }

  el.innerHTML = items.map(it => {
    const badge = it.processed
      ? '<span class="lp-badge" style="background:#88C07022;color:var(--accent);"><i class="ph ph-check"></i></span>'
      : '<span class="lp-badge" style="background:#88888822;color:var(--text-dim);">new</span>';
    const onclick = it.type === 'source'
      ? 'viewSourceInMain(' + it.idx + ')'
      : 'scrollToItem(' + it.idx + ')';
    return '<div class="lp-item" onclick="' + onclick + '">' +
      '<div style="flex:1;min-width:0;">' +
        '<div class="lp-title">' + escapeAttr((it.title || '').slice(0, 50)) + '</div>' +
        '<div class="lp-meta">' + escapeAttr(it.sourceName || '') + '</div>' +
      '</div>' +
      badge +
    '</div>';
  }).join('');
}

function scrollToItem(idx) {
  const el = document.getElementById('item-' + idx);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function viewSourceInMain(srcIdx) {
  const s = sources[srcIdx];
  if (!s) return;

  // switch to feed view and render this source's content
  if (currentView !== 'feed') toggleGraph();

  const el = document.getElementById('view-feed');

  // find matching allItems entry
  const itemIdx = allItems.findIndex(it => it._sourceId === s.id || (s.url && it.link === s.url));

  let html = '<div style="padding:16px;">';
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">';
  html += '<div>';
  html += '<div style="font-size:16px;font-weight:700;color:var(--text-bright);font-family:-apple-system,sans-serif;">' + escapeAttr(s.title || '') + '</div>';
  html += '<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">' + escapeAttr(s.sourceName || '') + ' · ' + new Date(s.ingestedAt || s.date).toLocaleDateString() + '</div>';
  if (s.url) html += '<div style="font-size:11px;margin-top:2px;"><a href="' + escapeAttr(s.url) + '" target="_blank" style="color:var(--accent);">' + escapeAttr(s.url) + '</a></div>';
  html += '</div>';
  html += '<div style="display:flex;gap:6px;">';
  if (itemIdx >= 0) {
    html += '<button class="act-btn" onclick="startWalk(' + itemIdx + ')"><i class="ph ph-cpu"></i> process</button>';
    if (allItems[itemIdx]._processed) {
      html += '<button class="act-btn" onclick="generateDigest(' + itemIdx + ', this)"><i class="ph ph-lightning"></i> generate</button>';
    }
  }
  html += '<button class="act-btn" onclick="renderItems()"><i class="ph ph-arrow-left"></i> back to feed</button>';
  html += '</div></div>';

  // processing status
  if (s.processed) {
    const linkedSites = Object.entries(graph.entities)
      .filter(([id, e]) => (e.sources || []).some(src => src.url === s.url || src.title === s.title));
    if (linkedSites.length) {
      html += '<div style="margin-bottom:12px;"><div class="lp-label"><i class="ph ph-map-pin"></i> sites found (' + linkedSites.length + ')</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:4px;">';
      linkedSites.forEach(([id, e]) => {
        html += '<span class="eo-entity" data-kind="' + e.kind + '" onclick="selectEntity(\'' + id + '\');toggleGraph();" style="cursor:pointer;">' + escapeAttr(e.canonical) + '<span class="eo-kind">' + (e.subtype || e.kind) + '</span></span>';
      });
      html += '</div></div>';
    }
  } else {
    html += '<div style="color:var(--text-dim);font-size:11px;margin-bottom:12px;"><i class="ph ph-info"></i> not yet processed — click process to index this content</div>';
  }

  // show output if generated
  if (itemIdx >= 0 && allItems[itemIdx].generatedRaw) {
    html += '<div style="margin-bottom:16px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:3px;">';
    html += '<div class="lp-label"><i class="ph ph-lightning"></i> generated entry</div>';
    html += mdToHtml(allItems[itemIdx].generatedRaw);
    html += '</div>';
  }

  // full content
  html += '<div class="lp-label" style="margin-top:8px;"><i class="ph ph-article"></i> source content</div>';
  html += '<div style="font-family:-apple-system,sans-serif;font-size:13px;line-height:1.8;color:var(--text);background:var(--surface);padding:16px;border-radius:3px;max-height:60vh;overflow-y:auto;white-space:pre-wrap;">' + escapeAttr(s.body || '(no content)') + '</div>';

  html += '</div>';
  el.innerHTML = html;
}

init();
</script>

</body>
</html>
